<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOMOB — 바람의 유적섬</title>
<meta name="description" content="TOMOB 항해 원정단 RPG · 직접 걸어볼 수 있는 Three.js 샘플 섬">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23294039'/%3E%3Cpath d='M32 10L45 47L32 39L19 47Z' fill='%23ecddb2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ivory:#f6f2df;--ink:#203c35;--glass:rgba(249,247,231,.91);--line:rgba(48,66,47,.19)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d7d8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #986428;outline-offset:4px}button:disabled{opacity:.45;cursor:not-allowed}#viewport{position:fixed;inset:0}canvas{display:block;touch-action:none}#viewport canvas{width:100%;height:100%}.topbar{position:absolute;left:32px;right:32px;top:26px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}.brand{display:flex;align-items:center;gap:12px;text-shadow:0 1px 10px #eaf6e688}.brand svg{width:34px;height:34px}.brand strong{font-size:17px;letter-spacing:.24em}.brand small{display:block;font-size:8px;letter-spacing:.32em;margin-top:3px}.toolbar{display:flex;align-items:center;gap:8px;pointer-events:auto}.pill{border:1px solid #ffffff90;background:rgba(248,249,234,.8);backdrop-filter:blur(16px);border-radius:100px;color:#344c43;font-size:11px;padding:10px 15px;transition:background .2s}.pill:hover{background:#fff9e8}#fps{font:10px ui-monospace,monospace;padding-left:8px;opacity:.7}.card{position:absolute;bottom:42px;left:34px;z-index:5;width:294px;pointer-events:none}.eyebrow{font-size:9px;font-weight:600;letter-spacing:.23em;display:flex;align-items:center;gap:12px}.eyebrow:before{content:'';display:block;width:23px;height:1px;background:currentColor}h1{font-family:Georgia,'Batang',serif;font-size:34px;line-height:1.3;font-weight:500;letter-spacing:-.055em;margin:12px 0 9px;text-shadow:0 1px 18px #ffffecaa}.tagline{font-size:11px;letter-spacing:.04em;margin:0 0 23px;opacity:.8}.start{pointer-events:auto;background:#24483b;color:#faf0d5;padding:14px 23px;border:1px solid #284b3c;border-radius:5px;font-size:12px;box-shadow:0 8px 24px #284b3c1a;min-width:188px;letter-spacing:.06em;transition:transform .2s,background .2s}.start:hover{background:#365e48;transform:translateY(-2px)}.under{margin-top:13px;font:8px ui-monospace,monospace;opacity:.65;letter-spacing:.08em}.panel{position:absolute;right:34px;top:95px;z-index:5;width:218px;background:var(--glass);border:1px solid #fff7d780;border-radius:8px;padding:19px 16px 13px;backdrop-filter:blur(14px);box-shadow:0 16px 60px #24483b0d}.panel-head{font-size:10px;letter-spacing:.08em;display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}.panel-head b{font:18px Georgia,serif;color:#3d5c42}.panel-head em{font-size:10px;font-style:normal;opacity:.45}.location{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:10px 2px;color:#506150;font-size:10px;text-align:left}.location:hover{color:#172f24}.location-dot{width:5px;height:5px;border:1px solid #879477;border-radius:50%;flex-shrink:0}.location.found .location-dot{background:#a18941;border-color:#a18941;box-shadow:0 0 0 3px #ac944618}.location-arrow{margin-left:auto;font-size:13px;opacity:.35}.panel-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:5px;font-size:9px;color:#82907c;line-height:1.6}.compass{position:absolute;left:50%;top:29px;transform:translateX(-50%);font-size:9px;letter-spacing:.35em;opacity:.55;display:flex;gap:25px;align-items:center}.compass b{font-weight:500;color:#233f34}.compass span{width:45px;height:1px;background:linear-gradient(90deg,transparent,#48655590,transparent)}#map-wrap{position:absolute;right:34px;bottom:40px;z-index:5;width:166px;height:166px;border:1px solid #fff6cba0;border-radius:50%;padding:6px;box-shadow:0 10px 35px #214a4422;background:rgba(237,240,213,.65);backdrop-filter:blur(8px)}#minimap{width:152px;height:152px;border-radius:50%;opacity:.92}.north{position:absolute;left:50%;top:-19px;transform:translateX(-50%);font:9px Georgia;color:#25483d}.map-scale{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font:8px ui-monospace;opacity:.65;letter-spacing:.1em}.controlbar{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.035em;text-align:center;color:#2d544d;white-space:nowrap;background:#f0f5e6aa;backdrop-filter:blur(10px);padding:8px 15px;border-radius:30px;z-index:6}#notification{position:absolute;left:50%;top:96px;transform:translate(-50%,-14px);opacity:0;transition:all .4s;z-index:30;background:#24483be8;border:1px solid #8ca18480;border-radius:7px;padding:13px 23px;color:#f6ebc8;font-size:12px;pointer-events:none;box-shadow:0 6px 24px #20463d20}#notification.show{opacity:1;transform:translate(-50%,0)}#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#ffffffb0;box-shadow:0 0 3px #0007;z-index:4;pointer-events:none}.hidden{display:none!important}.photo .ui{opacity:0;pointer-events:none}.photo #viewport{cursor:default}.walking .card h1{font-size:22px}.walking .card .tagline,.walking .under{display:none}.walking .panel{opacity:.86}.walking .start{padding:10px 17px;font-size:10px;min-width:145px}.walking .card{bottom:49px}.walking .eyebrow{font-size:8px}.ui{transition:opacity .25s}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#e9eee0;z-index:100;transition:opacity .6s,visibility .6s}#loading.done{opacity:0;visibility:hidden}.load-inner{text-align:center}.load-sigil{font:64px Georgia;color:#587a63;animation:breathe 2s infinite}.load-inner h2{font:normal 24px Georgia,'Batang',serif;letter-spacing:-.04em;margin:18px 0 14px}.load-inner p{font-size:11px;color:#718373}.load-inner small{display:block;font-size:8px;letter-spacing:.3em;color:#8e9a85;margin-top:35px}@keyframes breathe{50%{opacity:.45;transform:translateY(-4px)}}#fatal{white-space:pre-wrap;color:#9c3828;max-width:560px;padding:20px;font:12px monospace}#qa{position:absolute;bottom:65px;left:345px;right:220px;max-height:45vh;overflow:auto;z-index:40;background:#122920ec;color:#d5eedb;font:10px monospace;padding:15px;border-radius:8px}#qa:empty{display:none}@media(max-width:900px){.topbar{left:19px;right:19px;top:19px}.compass{display:none}.panel{right:19px;top:82px;width:188px;padding:14px 12px}.card{left:21px;bottom:55px}.toolbar #quality,.toolbar #fps{display:none}h1{font-size:29px}.location{font-size:9px;padding:8px 0}#map-wrap{right:20px;bottom:54px;width:126px;height:126px}#minimap{width:112px;height:112px}.controlbar{font-size:8px;max-width:95%;white-space:normal;width:max-content;line-height:1.7}.pill{font-size:10px;padding:9px 11px}}@media(max-width:600px){.brand strong{font-size:13px}.brand small{font-size:7px}.brand svg{width:27px}.toolbar #lighting{display:none}.panel{top:77px;width:156px}.panel-head{font-size:9px}.panel-foot{font-size:8px}.location{font-size:8px}.card{width:220px}h1{font-size:26px}#map-wrap{display:none}.under{max-width:200px;font-size:7px}.walking .panel{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="viewport" aria-label="바람의 유적섬 3D 게임 화면"></div>
<header class="topbar ui"><div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width=".7"/><path d="M20 5L27 29L20 24L13 29Z" fill="currentColor"/><path d="M5 20H10M30 20H35M20 30V35" stroke="currentColor" stroke-width=".7"/></svg><div><strong>TOMOB</strong><small>EXPEDITION CHRONICLES</small></div></div><nav class="toolbar"><button class="pill" id="lighting">◒ 황금빛 저녁</button><button class="pill" id="quality">화질 · 높게</button><button class="pill" id="reset" title="선착장으로 돌아가기">↺ 출발점</button><button class="pill" id="photo" title="P 키로 화면 표시 복귀">▣ 사진 모드</button><span id="fps">— FPS</span></nav></header>
<div class="compass ui"><span></span>W <b>N</b> E<span></span></div>
<aside class="panel ui"><div class="panel-head"><span>발견한 장소</span><div><b id="discovered">00</b><em> / 07</em></div></div><div id="locations"></div><div class="panel-foot">전체 보기에서는 장소를 살펴보고,<br>탐험 모드에서는 해당 장소로 이동합니다.</div></aside>
<section class="card ui"><div class="eyebrow" id="mode-label">ISLAND STUDY / 01</div><h1>바람의 유적섬</h1><p class="tagline">파도가 숨긴 길, 숲 너머의 오래된 약속.</p><button id="play" class="start">직접 탐험하기 ↗</button><div class="under" id="asset-note">THREE.JS × RAPIER · PLAYABLE TERRAIN</div></section>
<div id="map-wrap" class="ui"><span class="north">N</span><canvas id="minimap" width="200" height="200" aria-label="섬 지도"></canvas><span class="map-scale">0 ━━━━━ 100 m</span></div>
<div class="controlbar ui" id="controls-note">드래그 회전 · 휠 확대 · 오른쪽 목록으로 장소 살펴보기</div>
<div id="crosshair" hidden></div><div id="notification" role="status" aria-live="polite"></div><pre id="qa"></pre>
<div id="loading"><div class="load-inner"><div class="load-sigil">◈</div><h2>새로운 섬을 발견하는 중</h2><p id="loading-note">항해 준비</p><small>TOMOB / AURORA ISLAND</small><pre id="fatal"></pre></div></div>
<script type="module">
import {launchIslandLab} from './modules/aurora-island.js';
try {const app=await launchIslandLab();if(new URLSearchParams(location.search).has('qa'))setInterval(()=>document.querySelector('#qa').textContent=JSON.stringify(app.report,null,2),1000);}
catch(e){console.error(e);document.querySelector('#fatal').textContent='섬을 불러오지 못했습니다.\n'+e.message+'\n네트워크 연결을 확인하고 새로고침해 주세요.';}
</script>
</body></html>
