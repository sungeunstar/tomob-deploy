<!--
  select.html — 오프닝 골든패스 [1] GAME START 직후.
  흐름: intro START GAME → 캐릭터 선택 → 추종자 선택 → tutorial.html?char=&follower=&name=
  레이아웃(레퍼런스: ref/화면/캐릭터선택레퍼2.jpg = Lost Ark 클래스 선택): 검정+금색 고급 톤.
    좌측 세로 리스트(엠블럼+한글명+영문명, 선택 금색강조) · 가운데 대형 3D 캐릭터(선택 직업, 콤보→궁극기 모션·VFX)
    · 우측 정보 패널(큰 엠블럼 + 직업명 한/영 + 난이도◆ + 설명 + 레이더 + 캐릭터명 입력 + 클래스 선택 버튼) · 좌상단 BACK.
  검증 계약: window.__sel / __selectIndex(i) / __confirm() / __back() / __selReady / __playFx(key) / __clipNames.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{ --gold:#41c6e0; --gold-bright:#7ad9ee; --line:rgba(65,198,224,.32); }   /* 디자인시스템 악센트 = 청록(cyan) */
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;font-family:Pretendard,system-ui,'Malgun Gothic',sans-serif;
    color:#eef1f6;cursor:default;user-select:none;background:#070707}
  /* ── 어두운 + 은은한 금빛 배경 ── */
  #bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(48% 62% at 50% 42%, rgba(74,118,168,.42) 0%, rgba(38,58,92,.24) 32%, rgba(20,30,52,.1) 58%, transparent 78%),
      radial-gradient(120% 80% at 50% 118%, rgba(56,92,140,.22) 0%, rgba(26,40,64,.1) 44%, transparent 70%),
      radial-gradient(82% 60% at 50% -8%, rgba(60,150,180,.13) 0%, transparent 60%),
      linear-gradient(180deg,#070a12 0%,#0a0f1e 50%,#0c1224 100%);}
  #bg::before{content:'';position:absolute;left:50%;top:8%;width:42%;height:84%;transform:translateX(-50%);pointer-events:none;opacity:.55;
    background:radial-gradient(50% 60% at 50% 40%, rgba(96,184,214,.16) 0%, transparent 70%)}   /* 캐릭터 뒤 청록 빛기둥 */
  #bg::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 320px 130px rgba(0,0,0,.58)}
  #stage{position:fixed;inset:0;z-index:1}
  #ui{position:fixed;inset:0;z-index:5;pointer-events:none}
  /* 🏮 내용은 modules/loadscreen.js가 채운다. 여기 배경은 모듈 로드 전 첫 프레임용. */
  #load{position:fixed;inset:0;z-index:9999;background:#050505 url('/tomob-deploy/ui/loading_bg.png') center/cover no-repeat}

  .logo{position:fixed;left:34px;top:24px;z-index:7;font-size:19px;letter-spacing:.16em;font-weight:300;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .logo b{font-weight:800;color:#41c6e0;letter-spacing:.07em}
  .logo .tab{display:inline-block;width:8px;height:15px;margin-right:9px;vertical-align:-2px;background:#41c6e0;clip-path:polygon(0 0,100% 25%,100% 75%,0 100%);box-shadow:0 0 10px #41c6e0}
  .back{position:fixed;left:32px;top:118px;z-index:7;display:flex;align-items:center;gap:7px;cursor:pointer;pointer-events:auto;
    color:#d8c79e;font-size:13px;font-weight:700;letter-spacing:.14em;padding:7px 15px 7px 11px;border-radius:8px;
    border:1px solid var(--line);background:rgba(20,16,10,.5);transition:.15s}
  .back:hover{color:#fff;border-color:var(--gold);background:rgba(40,30,16,.66)}

  /* 우상단 사운드 ON/OFF 토글 */
  .snd{position:fixed;right:34px;top:24px;z-index:8;display:flex;align-items:center;gap:8px;cursor:pointer;pointer-events:auto;
    color:#d8c79e;font-size:12px;font-weight:800;letter-spacing:.14em;padding:8px 14px 8px 12px;border-radius:9px;
    border:1px solid var(--line);background:rgba(20,16,10,.5);transition:.15s}
  .snd:hover{color:#fff;border-color:var(--gold);background:rgba(40,30,16,.66)}
  .snd svg{width:17px;height:17px;display:block}
  .snd.off{color:rgba(150,140,120,.6)}
  .snd.off .wave{opacity:0}
  .snd .slash{opacity:0}
  .snd.off .slash{opacity:1}

  /* 상단 타이틀 (금색 장식) */
  .ti{position:fixed;left:50%;top:30px;transform:translateX(-50%);z-index:7;text-align:center}
  .ti .deco{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);font-size:13px;letter-spacing:.2em}
  .ti .deco::before,.ti .deco::after{content:'';width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .ti .deco::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .ti b{display:block;font-size:22px;font-weight:800;letter-spacing:.06em;color:#fff;margin-top:5px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .ti small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:rgba(200,180,140,.55);margin-top:4px}

  /* ════ 좌측 세로 리스트 ════ */
  #roster{position:fixed;left:max(28px,calc(50% - 575px));top:50%;transform:translateY(-50%);width:264px;z-index:6;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
  .ritem{display:flex;align-items:center;gap:14px;padding:9px 12px 9px 9px;border-radius:12px;cursor:pointer;
    background:linear-gradient(100deg,rgba(28,23,14,.5),rgba(14,12,9,.35));border:1px solid rgba(65,198,224,.14);
    transition:transform .14s,border-color .14s,background .14s}
  .ritem:hover{transform:translateX(3px);border-color:rgba(65,198,224,.4)}
  .ritem.on{border-color:var(--gold);background:linear-gradient(100deg,rgba(80,62,30,.6),rgba(40,30,14,.4));box-shadow:0 6px 22px rgba(180,140,60,.2)}
  .ritem .em{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center;
    filter:saturate(.6) brightness(.7);transition:filter .14s}
  .ritem.on .em{filter:none;transform:scale(1.06)}
  .ritem .em img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
  .ritem .tx .nm{font-size:18px;font-weight:800;color:#efe6d2;line-height:1.05}
  .ritem.on .tx .nm{color:#fff}
  .ritem .tx .en{font-size:11px;font-weight:600;letter-spacing:.12em;color:rgba(190,170,130,.6);margin-top:3px;text-transform:uppercase}

  /* ════ 우측 정보 패널 ════ */
  #detail{position:fixed;right:max(28px,calc(50% - 575px));top:50%;transform:translateY(-50%);width:300px;z-index:6;pointer-events:auto;text-align:center}
  #detail .bem{width:108px;height:108px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}
  #detail .bem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(65,198,224,.4))}
  #detail .nm{font-size:42px;font-weight:900;line-height:.95;color:#fff;letter-spacing:.01em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
  #detail .en{font-size:13px;font-weight:600;letter-spacing:.22em;color:var(--gold-bright);text-transform:uppercase;margin-top:6px}
  #detail .rule{width:160px;height:1px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
  #detail .rule::after{content:'◆';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);font-size:9px}   /* ◆ 뒤 검정박스(#0b0908) 제거 — 네이비 배경에 검정 박스로 떠보이던 옛 테마 잔재 */
  #detail .diff{font-size:12px;color:rgba(200,182,146,.75);letter-spacing:.04em}
  #detail .diff .d{margin-left:8px;font-size:13px;letter-spacing:3px}
  #detail .diff .d b{color:var(--gold-bright)}#detail .diff .d i{color:rgba(140,120,80,.4);font-style:normal}
  #detail .ds{font-size:12.5px;line-height:1.7;color:rgba(214,206,188,.78);margin-top:13px}
  #stats{display:flex;justify-content:center;margin-top:14px}
  #stats svg{display:block}
  #detail .nameinp{width:100%;font:600 14px Pretendard;letter-spacing:.01em;padding:12px 16px;border-radius:10px;margin-top:16px;
    background:rgba(18,14,9,.7);border:1px solid var(--line);color:#fff;outline:none;text-align:center;transition:.15s}
  #detail .nameinp::placeholder{color:rgba(180,162,128,.5)}
  #detail .nameinp:focus{border-color:var(--gold)}
  #detail .nameinp.invalid{border-color:#e0705a;background:rgba(60,24,18,.55)}
  #detail .nameinp.invalid::placeholder{color:rgba(232,150,128,.92)}
  @keyframes nshake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
  #detail .nameinp.shake{animation:nshake .35s}
  /* 클래스 선택 버튼 (빨강+금테, 레퍼런스 톤) */
  #detail .pick{margin-top:13px;width:100%;padding:14px 0;border-radius:11px;cursor:pointer;pointer-events:auto;
    font:800 16px Pretendard;letter-spacing:.08em;color:#fff;
    background:linear-gradient(180deg,rgba(65,198,224,.32),rgba(38,140,170,.18));border:1px solid var(--gold);
    box-shadow:0 8px 26px rgba(65,198,224,.32),inset 0 1px 0 rgba(180,235,255,.2);transition:.15s}
  #detail .pick:hover{filter:brightness(1.14);background:linear-gradient(180deg,rgba(80,212,236,.42),rgba(48,160,190,.24));box-shadow:0 10px 32px rgba(65,198,224,.46),inset 0 1px 0 rgba(180,235,255,.28)}

  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;font:11px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:rgba(170,150,110,.35)}

  /* ════ 추종자 모드(fmode) = 선택화면(원신) 구도 — 좌 2열 그리드 + 우 출신만 ════ */
  body.fmode #roster{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:300px;left:max(24px,calc(50% - 610px))}
  body.fmode .ritem{padding:7px 9px 7px 7px}
  body.fmode .ritem .em{width:44px;height:44px}
  body.fmode .ritem .tx .nm{font-size:15px}
  body.fmode .ritem .em img{border-radius:6px}
  body.fmode #detail .bem,body.fmode #detail .diff,body.fmode #detail #stats{display:none}   /* 이름입력칸은 추종자도 표시(플레이어가 동료 이름 지정) */

  /* ════ 진영 선택(pmode) = 배너 2택 ════ */
  #factions{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;gap:54px;pointer-events:none}
  body.pmode #factions{display:flex}
  body.pmode #roster,body.pmode #detail{display:none}
  .fcard{pointer-events:auto;cursor:pointer;width:312px;border-radius:18px;overflow:hidden;position:relative;
    background:linear-gradient(180deg,rgba(22,28,44,.55),rgba(9,13,23,.5));border:1px solid rgba(65,198,224,.16);
    box-shadow:0 12px 40px rgba(0,0,0,.5);transition:transform .2s,border-color .2s,box-shadow .2s}
  .fcard:hover{transform:translateY(-5px);border-color:rgba(65,198,224,.46)}
  .fcard.on{border-color:var(--gold);box-shadow:0 18px 56px rgba(65,198,224,.34),inset 0 0 0 1px rgba(122,217,238,.35)}
  .fcard .ban{width:100%;height:404px;background-size:cover;background-position:50% 16%;
    filter:saturate(.78) brightness(.74);transition:filter .2s}
  .fcard.on .ban{filter:saturate(1.05) brightness(1.04)}
  .fcard .ban::after{content:'';position:absolute;left:0;right:0;top:300px;height:148px;
    background:linear-gradient(180deg,transparent,rgba(9,13,23,.82) 64%,rgba(9,13,23,.95))}
  .fcard .cap{position:relative;padding:0 22px 22px;margin-top:-46px;text-align:center}
  .fcard .tag{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--gold-bright);text-transform:uppercase}
  .fcard .fn{font-size:30px;font-weight:900;color:#fff;letter-spacing:.02em;margin-top:6px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .fcard .fe{font-size:11px;font-weight:600;letter-spacing:.2em;color:rgba(190,170,130,.62);text-transform:uppercase;margin-top:3px}
  .fcard .fl{font-size:13.5px;font-weight:700;color:#dfe7f1;margin-top:12px}
  .fcard .fd{font-size:12px;line-height:1.72;color:rgba(206,210,224,.7);margin-top:8px}
  .fcard .chk{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;opacity:0;transform:scale(.7);
    background:var(--gold);color:#06121a;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(65,198,224,.5);transition:.18s}
  .fcard.on .chk{opacity:1;transform:scale(1)}
  /* 진영 확정 버튼(하단 중앙) */
  #fgo{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:7;display:none;pointer-events:auto;cursor:pointer;
    min-width:300px;text-align:center;padding:15px 44px;border-radius:12px;font:800 16px Pretendard;letter-spacing:.08em;color:#fff;
    background:linear-gradient(180deg,rgba(65,198,224,.34),rgba(38,140,170,.2));border:1px solid var(--gold);
    box-shadow:0 10px 30px rgba(65,198,224,.34),inset 0 1px 0 rgba(180,235,255,.22);transition:.15s}
  #fgo:hover{filter:brightness(1.14)}
  body.pmode #fgo{display:block}
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>
<div id="ui">
  <div class="logo"><img src="/tomob-deploy/intro/logo.png" alt="tomob" style="height:74px;vertical-align:middle;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))"></div>
  <div class="back" id="btnBack">‹ BACK</div>
  <div class="snd on" id="sndBtn" title="배경음 켜기/끄기">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
      <path class="wave" d="M16.5 8.6a5 5 0 0 1 0 6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line class="slash" x1="2.5" y1="2.5" x2="21.5" y2="21.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg><span class="lbl" id="sndLbl">ON</span></div>
  <div class="ti"><span class="deco" id="ttDeco">CLASS SELECT</span><b id="ttTitle">클래스 선택</b><small id="ttStep">STEP 1 / 2 · 함께 항해할 캐릭터를 선택해주세요</small></div>

  <div id="roster"></div>

  <div id="detail">
    <div class="bem"><img id="shEm" src="" alt=""></div>
    <div class="nm" id="shName">팔라딘</div>
    <div class="en" id="shEn">Knight</div>
    <div class="rule"></div>
    <div class="diff">난이도<span class="d" id="shDiff"></span></div>
    <div class="ds" id="shDesc"></div>
    <div id="stats"></div>
    <input id="charName" class="nameinp" placeholder="캐릭터 이름을 입력하세요" maxlength="12" autocomplete="off" spellcheck="false">
    <div class="pick" id="btnNext">클래스 선택</div>
  </div>

  <div id="factions"></div>
  <div id="fgo">출항하기</div>

</div>
<div id="load"></div>

<!-- 🎭 캐릭터 선택 로비(세이브 있으면 진입 시 먼저). 3D 스테이지 재활용 + 하단 캐릭터 리스트. body 직속(#stage 캔버스 클릭 가로채기 회피). -->
<style>
  #lobby{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;justify-content:space-between;pointer-events:none;
    font-family:'Pretendard',system-ui,'Malgun Gothic',sans-serif;color:#e9e2d2}
  #lobby .lb-top{text-align:center;padding:26px 0 0;pointer-events:none}
  #lobby .lb-ti{font-size:26px;font-weight:800;letter-spacing:.12em;color:#f0d9a8;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  #lobby .lb-ti::before,#lobby .lb-ti::after{content:"—";color:#7c6a3e;margin:0 14px;font-weight:400}
  #lobby .lb-sub{margin-top:6px;font-size:12.5px;letter-spacing:.18em;color:#9a917d;text-transform:uppercase}
  #lobby .lb-bottom{padding:0 26px 30px;display:flex;flex-direction:column;gap:16px;align-items:center;pointer-events:none}
  #lobby .lb-list{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto;max-width:1200px}
  #lobby .lb-card{position:relative;width:190px;padding:12px 14px;border-radius:9px;cursor:pointer;
    background:linear-gradient(180deg,rgba(16,20,27,.86),rgba(10,13,19,.9));border:1px solid rgba(176,148,96,.3);
    transition:border-color .16s,transform .16s,box-shadow .16s;display:flex;gap:11px;align-items:center}
  #lobby .lb-card:hover{border-color:rgba(201,168,90,.6);transform:translateY(-2px)}
  #lobby .lb-card.on{border-color:#e7c878;box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 1px rgba(231,200,120,.5),0 0 20px -4px rgba(231,200,120,.5)}
  #lobby .lb-card .lb-em{width:44px;height:44px;flex:0 0 44px;border-radius:7px;background:rgba(0,0,0,.35) center/72% no-repeat;border:1px solid rgba(176,148,96,.28)}
  #lobby .lb-card .lb-info{min-width:0;flex:1}
  #lobby .lb-card .lb-nm{font-size:15px;font-weight:700;color:#f2e6c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #lobby .lb-card .lb-cls{font-size:11.5px;color:#b8a87e;margin-top:1px}
  #lobby .lb-card .lb-meta{margin-top:5px;display:flex;gap:9px;font-size:11.5px;color:#cdbf9a}
  #lobby .lb-card .lb-meta b{color:#f0d060;font-weight:700}
  #lobby .lb-card .lb-crown{position:absolute;top:-8px;right:-6px;font-size:15px;filter:drop-shadow(0 1px 2px #000)}
  #lobby .lb-actions{display:flex;gap:12px;pointer-events:auto}
  #lobby .lb-btn{padding:11px 26px;border-radius:24px;border:1px solid rgba(201,168,90,.45);cursor:pointer;
    font:800 14px 'Pretendard',system-ui;background:linear-gradient(180deg,rgba(22,28,38,.92),rgba(12,17,26,.94));color:#e6dcc2;
    transition:filter .15s,border-color .15s}
  #lobby .lb-btn:hover{filter:brightness(1.15);border-color:rgba(201,168,90,.75)}
  #lobby .lb-start{background:linear-gradient(180deg,#ecc962,#a9842f);color:#2a1d06;border-color:#e7c878}
  #lobby .lb-del{background:linear-gradient(180deg,rgba(40,20,20,.9),rgba(28,12,12,.92));color:#e0a090;border-color:rgba(196,120,96,.4)}
  /* 로비 모드 = 생성 흐름 UI 숨김(3D 스테이지+로고+사운드는 유지) */
  body.lobbymode #roster,body.lobbymode #detail,body.lobbymode #factions,body.lobbymode #fgo,
  body.lobbymode .ti,body.lobbymode #btnBack{display:none !important}
</style>
<div id="lobby">
  <div class="lb-top"><div class="lb-ti">캐릭터 선택</div><div class="lb-sub">이어서 항해할 캐릭터를 선택하세요</div></div>
  <div class="lb-bottom">
    <div class="lb-list" id="lbList"></div>
    <div class="lb-actions">
      <button class="lb-btn lb-start" id="lbStart">▸ 게임 시작</button>
      <button class="lb-btn lb-new" id="lbNew">＋ 신규 캐릭터</button>
      <button class="lb-btn lb-del" id="lbDel">🗑 삭제</button>
    </div>
  </div>
</div>

function radialTex(inner,outer){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');

// ── 발밑 마법진 디스크(청록 발광 링 + 룬 틱 + 안쪽 글로우) ──
function discTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0,'rgba(86,200,232,0.13)'); gr.addColorStop(0.5,'rgba(56,150,190,0.05)'); gr.addColorStop(0.8,'rgba(65,198,224,0.015)'); gr.addColorStop(1,'rgba(65,198,224,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(128,128,128,0,7); g.fill();
  g.strokeStyle='rgba(120,224,248,0.6)'; g.lineWidth=3.5; g.beginPath(); g.arc(128,128,104,0,7); g.stroke();
  g.strokeStyle='rgba(65,198,224,0.28)'; g.lineWidth=2; g.beginPath(); g.arc(128,128,116,0,7); g.stroke();
  g.strokeStyle='rgba(130,228,250,0.5)'; g.lineWidth=2.5;
  for(let i=0;i<36;i++){ const a=i/36*6.2832, r1=(i%3===0?90:96), r2=101;
    g.beginPath(); g.moveTo(128+Math.cos(a)*r1,128+Math.sin(a)*r1); g.lineTo(128+Math.cos(a)*r2,128+Math.sin(a)*r2); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const poolMat=new THREE.MeshBasicMaterial({map:discTex(),transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false});

let _clipMap=null, _idleClip=null;
async function getClips(){ if(_clipMap) return _clipMap;

function normToHeight(m,H){ let bb=new THREE.Box3().setFromObject(m),s=new THREE.Vector3(); bb.getSize(s);
  m.scale.setScalar(H/(s.y||1)); let b2=new THREE.Box3().setFromObject(m); m.position.y-=b2.min.y; }
async function attachWeapon(model,wkey){
  if(!wkey||!WCFG[wkey]) return; const cfg=WCFG[wkey]; const bones={};
  model.traverse(o=>{ if(o.isBone){ if(o.name==='handslotr')bones.r=o; if(o.name==='handslotl')bones.l=o; } });
  async function put(url,slot,pos,rot){ try{ const g=await loadGLB(url); const w=skClone(g.scene);
    w.traverse(o=>{ if(o.isMesh) o.frustumCulled=false; });
    if(pos) w.position.set(pos[0],pos[1],pos[2]); if(rot) w.rotation.set(rot[0],rot[1],rot[2]);
    const b=bones[slot]; if(b) b.add(w); else model.add(w); return {w, bone:b}; }catch(e){ return null; } }
  const main=await put(cfg.url, cfg.slot, cfg.pos, cfg.rot);
  if(main){ model.userData.weaponMain=main.w; model.userData.weaponBone=main.bone; }
  if(cfg.offhand) await put(cfg.offhand, 'l', cfg.offhandPos);
}
// ── 손에 든 무기 끝(지팡이 촉/활)을 발사 머즐로 — 무기에 reparent해 애니 추종 ──
function setWeaponMuzzle(m){
  const w=m.userData.weaponMain, bone=m.userData.weaponBone; if(!w||!bone) return;
  m.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(w);
  const hp=new THREE.Vector3(); bone.getWorldPosition(hp);   // 손(무기 그립)
  // 무기 AABB 8코너 중 손에서 가장 먼 점 = 무기 끝(지팡이 촉)
  let tip=null,best=-1;
  for(const x of [box.min.x,box.max.x]) for(const y of [box.min.y,box.max.y]) for(const z of [box.min.z,box.max.z]){
    const c=new THREE.Vector3(x,y,z), d=c.distanceTo(hp); if(d>best){best=d;tip=c;} }
  // ★활은 가운데를 쥐어 '가장 먼 코너'가 활 아래쪽(바닥 근처)이 됨 → 화살이 바닥서 발사되는 버그. 끝이 손보다 낮으면 손(그립) 높이서 발사.
  const anchor = (tip.y < hp.y - 0.05) ? hp.clone() : tip;
  const mk=new THREE.Object3D(); mk.position.copy(anchor); scene.add(mk); mk.updateMatrixWorld(true);
  w.attach(mk);                 // 무기 자식으로 reparent(월드 유지) → 지팡이 따라 움직임
  fx.setMuzzle(mk);
}

// ── 스탯 레이더(다이아몬드, 금색) ──
function buildRadar(stat,diff){
  const R=56, cx=98, cy=76, ang=[-90,0,90,180].map(d=>d*Math.PI/180);
  const pt=(i,v)=>[cx+Math.cos(ang[i])*R*v/5, cy+Math.sin(ang[i])*R*v/5];
  const ring=v=>ang.map((_,i)=>pt(i,v).join(',')).join(' ');
  const poly=ang.map((_,i)=>pt(i,stat[i]).join(',')).join(' ');
  let s=`<svg width="196" height="158" viewBox="0 0 196 158">`;
  s+=`<polygon points="${ring(5)}" fill="none" stroke="rgba(65,198,224,.28)"/>`;
  s+=`<polygon points="${ring(3.33)}" fill="none" stroke="rgba(65,198,224,.18)"/>`;
  s+=`<polygon points="${ring(1.66)}" fill="none" stroke="rgba(65,198,224,.12)"/>`;
  ang.forEach((_,i)=>{ const [x,y]=pt(i,5); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(65,198,224,.16)"/>`; });
  s+=`<polygon points="${poly}" fill="rgba(65,198,224,.26)" stroke="#7ad9ee" stroke-width="1.8"/>`;
  ang.forEach((_,i)=>{ const [x,y]=pt(i,stat[i]); s+=`<circle cx="${x}" cy="${y}" r="2.4" fill="#7ad9ee"/>`; });
  const lp=[[cx,13,'middle'],[cx+R+13,cy+4,'middle'],[cx,cy+R+16,'middle'],[cx-R-13,cy+4,'middle']];
  AX.forEach((t,i)=>{ s+=`<text x="${lp[i][0]}" y="${lp[i][1]}" fill="rgba(190,215,235,.82)" font-size="11" font-weight="700" text-anchor="${lp[i][2]}" font-family="Pretendard">${t}</text>`; });
  s+=`</svg>`; return s;
}

  shDiff.innerHTML=[0,1,2,3,4].map(k=>k<(d.diff||0)?'<b>◆</b>':'<i>◆</i>').join('');
  if(phase===1 && d.stat){ elStats.style.display='flex'; elStats.innerHTML=buildRadar(d.stat,d.diff); }
  else { elStats.style.display='none'; elStats.innerHTML=''; }
}

// ── 가운데 대형 캐릭터(선택 직업) ──
async function setShowcase(d,combat){
  routineToken++; const myTok=routineToken;
  fx.reset();
  if(showModel){ scene.remove(showModel); showModel=null; showMixer=null; fx.setModel(null); }
  const clips=await getClips(); if(myTok!==routineToken) return;
  try{
    const g=await loadGLB(d.path || (CHAR_DIR+d.file+'.glb')); if(myTok!==routineToken) return;
    const m=skClone(g.scene); m.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh){ o.frustumCulled=false; } });
    // ★마법사 망토: idle 바인드포즈에서 분홍 안감이 정면으로 펼쳐져 어색 → 쇼케이스에선 숨김(로브/모자/지팡이 유지)
    if(d.id==='mage') m.traverse(o=>{ if(/cape/i.test(o.name)) o.visible=false; });
    if(d.id==='tinyhero_m') _stripTiny(m,'m'); else if(d.id==='tinyhero_f') _stripTiny(m,'f');   // ★TinyHero 남/여 분리
    normToHeight(m, TARGET_H);
    showMixer=new THREE.AnimationMixer(m);
    // ★idle: 모델 자체 idle 우선(Polyart/Kenney 등), 없으면 KayKit 공용 idle
    //   TinyHero는 남/여 idle이 따로(0~22=남, 23~45=여) → 여자는 [23] 명시(generic find는 남자 [0]만 잡음 → 여자 T포즈).
    const mIdle = d.id==='tinyhero_f' ? ((g.animations||[])[23]||(g.animations||[])[0])
      : ((g.animations||[]).find(c=>/idle/i.test(c.name))||(g.animations||[])[0]||_idleClip);
    if(mIdle){ showMixer.clipAction(mIdle).play(); showMixer.update(0.3); }   // idle 포즈에서 본 위치 측정(T포즈 방지)
    m.updateMatrixWorld(true);
    // ★본 월드Y 기준 정규화 — SkinnedMesh의 Box3는 '바인드(T)포즈'라 발 위치를 못 잡음(떠있음 원인) → 실제 애니 본 좌표로 측정.
    //   머리~발 본 거리로 '몸 높이' 통일(투구/모자/후드 무관) + 발 본을 바닥에 접지.
    const boneY=(re)=>{ let mn=Infinity,mx=-Infinity; const w=new THREE.Vector3();
      m.traverse(o=>{ if(o.isBone&&re.test(o.name)){ o.getWorldPosition(w); mn=Math.min(mn,w.y); mx=Math.max(mx,w.y); } }); return {mn,mx}; };
    const head=boneY(/head/i), foot=boneY(/toe|foot/i);
    if(head.mx>-Infinity && foot.mn<Infinity){
      const bodyH=head.mx - foot.mn;
      if(bodyH>0.4){ m.scale.multiplyScalar(BODY_H/bodyH); m.updateMatrixWorld(true); }
      const f2=boneY(/toe|foot/i);
      m.position.y -= (f2.mn - FEET_Y - SOLE_OFF);   // 발 본을 바닥에(밑창 두께 SOLE_OFF 보정)
    }
    m.rotation.y=-0.16;
    scene.add(m); showModel=m; fx.setModel(m);
    if(combat){ await attachWeapon(m, CLASS_ANIM[d.id]?.w);
      // 투사체 직업(마법사/레인저)은 무기 끝에서 발사
      if(d.id==='mage'||d.id==='ranger'){ m.updateMatrixWorld(true); if(_idleClip) showMixer.update(0); if(d.id==='mage') setWeaponMuzzle(m); } }   // ★활(ranger)은 가운데 쥐어 muzzle이 활 바닥(바닥발사 버그) → muzzle 미설정 → 가슴 높이 fallback 발사. 지팡이(mage)만 촉 muzzle.
    if(myTok!==routineToken){ scene.remove(m); if(showModel===m){ showModel=null; showMixer=null; } return; }   // ★겹침 수정: 뒤늦게 정리되는 구 호출이 이미 교체된 새 모델의 참조(showModel)를 null로 덮어써, 다음 전환이 이전 캐릭터를 못 지우던 레이스. 자기 모델일 때만 null.
    startRoutine(showMixer, clips, combat?d.id:null, myTok, mIdle);
  }catch(e){ console.warn('[select] 쇼케이스 로드 실패', d.id, e&&e.message); }
}
function startRoutine(mixer, clips, classId, tok, idleClip){
  const idleAct = idleClip ? mixer.clipAction(idleClip) : null;
  // ★초기 idle은 fadeIn 금지 — 가중치 0에서 시작하면 바인드(T)포즈가 한 프레임 비쳐 'T자 깜빡'. 즉시 풀 가중치로 재생.
  if(idleAct){ idleAct.setLoop(THREE.LoopRepeat,Infinity); idleAct.reset().setEffectiveWeight(1).play(); }
  const def = classId && CLASS_ANIM[classId]; if(!def) return;
  const steps=def.seq.map((n,idx)=>({clip:clips.get(n), fx:def.fx&&def.fx[idx]})).filter(s=>s.clip);
  if(!steps.length) return;
  let i=0, prev=idleAct;
  function step(){ if(tok!==routineToken) return;
    if(i>=steps.length){ i=0; if(prev&&prev!==idleAct)prev.fadeOut(0.25); if(idleAct){ idleAct.reset().fadeIn(0.25).play(); prev=idleAct; } setTimeout(step,1100); return; }
    const s=steps[i++]; const c=s.clip; const a=mixer.clipAction(c);
    if(c.name==='Melee_2H_Attack_Spinning'){ const D=3000;
      a.setLoop(THREE.LoopRepeat,Infinity); a.clampWhenFinished=false; a.timeScale=1.6; a.reset();
      if(prev) prev.fadeOut(0.1); a.setEffectiveWeight(1).fadeIn(0.1).play(); prev=a;
      if(s.fx) setTimeout(()=>{ if(tok===routineToken) spawnFx(s.fx); }, 120);
      setTimeout(()=>{ a.timeScale=1; }, D); setTimeout(step, D); return;
    }
    a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished=true; a.reset();
    if(prev) prev.fadeOut(0.1); a.setEffectiveWeight(1).fadeIn(0.08).play(); prev=a;
    // ★마법(시전) = 손 내리는 후반에 발사 / 근접·사격 = 스윙 정점
    const isMagic = s.fx==='bolt'||s.fx==='nova'||s.fx==='novaIce';
    if(s.fx) setTimeout(()=>{ if(tok===routineToken) spawnFx(s.fx); }, c.duration*1000*(isMagic?0.64:0.34));
    setTimeout(step, Math.max(300, c.duration*1000*0.9));
  }
  setTimeout(step, 750);
}

// ════ 추종자 선택 = Dune형 세로 초상화 카드(흉상 3D를 캔버스로 렌더) ════
let _portR=null, _portScene=null, _portCam=null, _portCache={};
function _portInit(){ if(_portR) return;
  _portR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  _portR.setPixelRatio(Math.min(2,devicePixelRatio)); _portR.setSize(300,300);
  _portR.outputColorSpace=THREE.SRGBColorSpace; _portR.toneMapping=THREE.NoToneMapping;
  _portScene=new THREE.Scene();
  _portScene.add(new THREE.HemisphereLight(0xf0e2c4,0x2a2520,1.05));
  const k=new THREE.DirectionalLight(0xfff2da,2.4); k.position.set(2.5,5,5); _portScene.add(k);
  const rim=new THREE.DirectionalLight(0x88c0e0,1.6); rim.position.set(-4,3,-3); _portScene.add(rim);
  const fil=new THREE.DirectionalLight(0xd8d0c0,0.5); fil.position.set(-2,1,5); _portScene.add(fil);
  _portCam=new THREE.PerspectiveCamera(28,1,0.1,100); }
function _stripTiny(m, keep){   // TinyHero.glb = 남(MaleCharacterPolyart)+여(FemaleCharacterPolyart) 통짜. keep='m'→여 제거, 'f'→남 제거.
  const drop = keep==='m' ? 'FemaleCharacterPolyart' : 'MaleCharacterPolyart';
  const o=m.getObjectByName(drop); if(o&&o.parent) o.parent.remove(o); }
function _normBust(m){   // 초상화 전용: 전 캐릭터 동일 기준(bbox 전체높이)으로 정규화 → 머리 크기·프레이밍 일관(직업/NPC 섞여도).
  m.updateMatrixWorld(true);
  let bb=new THREE.Box3().setFromObject(m); const sz=new THREE.Vector3(); bb.getSize(sz);
  if(sz.y>0.01){ m.scale.multiplyScalar(BODY_H/sz.y); m.updateMatrixWorld(true); }
  bb=new THREE.Box3().setFromObject(m); m.position.y-=bb.min.y; }   // 발 접지
// 정사각 얼굴 썸네일(좌측 리스트용) — 다중 리그(모델 자체 idle 우선)
async function makeThumb(entry){ _portInit();
  try{ await getClips();
    const g=await loadGLB(entry.path || (CHAR_DIR+entry.file+'.glb')); const m=skClone(g.scene);
    m.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh) o.frustumCulled=false; });
    if(entry.id==='mage') m.traverse(o=>{ if(/cape/i.test(o.name)) o.visible=false; });
    if(entry.id==='tinyhero_m') _stripTiny(m,'m'); else if(entry.id==='tinyhero_f') _stripTiny(m,'f');   // ★썸네일도 남/여 분리
    const mx=new THREE.AnimationMixer(m);
    const clip = entry.id==='tinyhero_f' ? ((g.animations||[])[23]||(g.animations||[])[0])
      : ((g.animations||[]).find(c=>/idle/i.test(c.name))||(g.animations||[])[0]||_idleClip);
    if(clip){ try{ mx.clipAction(clip).play(); mx.update(0.4); }catch(e){} }
    _normBust(m); m.rotation.y=-0.18; _portScene.add(m);
    const bb=new THREE.Box3().setFromObject(m); const top=bb.max.y, focus=top-0.30;   // 머리~어깨
    _portCam.position.set(0, focus, 1.5); _portCam.lookAt(0, focus, 0);
    _portR.render(_portScene,_portCam);
    const url=_portR.domElement.toDataURL('image/png'); _portScene.remove(m); return url;
  }catch(e){ console.warn('[select] 썸네일 실패', entry.id, e&&e.message); return null; } }
async function ensureFollowerThumbs(){
  for(const d of FOLLOWER_ROSTER){ if(d.icon) continue; const u=await makeThumb(d); d.icon=u||''; }
}

function selectIndex(i){

function applyChrome(){

let chosenChar=null, chosenFollower=null, chosenFaction=null;
const nameByPhase={1:'',2:''};   // 1=캐릭터명, 2=추종자명 (단계 이동해도 각자 보존)
async function goPhase(p){
  if(phase===1||phase===2) nameByPhase[phase]=elName.value;   // 떠나기 전 현재 입력 보존
  phase=p; window.__sel.phase=p;
  applyChrome();
  routineToken++;   // 직전 단계 루틴(setTimeout 체인) 무효화
  document.body.classList.toggle('fmode', p===2);   // 추종자 모드 = 우측 패널 스탯/난이도 숨김(출신+이름입력)
  document.body.classList.toggle('pmode', p===3);   // 진영 모드 = 배너 2택, 3D/로스터 숨김
  if(p===1||p===2){ elName.placeholder = p===1?'캐릭터 이름을 입력하세요':'추종자 이름을 입력하세요'; elName.value=nameByPhase[p]||''; }
  if(p===3){   // 진영 선택 — 쇼케이스 제거하고 배너만
    if(showModel){ scene.remove(showModel); showModel=null; showMixer=null; fx.setModel(null); }
    buildFactions(); window.__sel.faction=FACTIONS[factionSel].id; return;
  }
  sel=0; window.__sel.index=0;
  roster=(p===1?CLASS_ROSTER:FOLLOWER_ROSTER);
  if(p===2) await ensureFollowerThumbs();            // 추종자 얼굴 썸네일 렌더(좌측 리스트용)
  buildRoster(); refreshInfo(); await setShowcase(roster[0], p===1);
}
function charNameVal(){ return (elName&&elName.value.trim())||'선장'; }
function requireName(){   // 이름 미입력 시 진행 차단(흔들기+경고테두리+포커스)
  if(elName.value.trim()) { elName.classList.remove('invalid'); return true; }
  elName.classList.add('invalid','shake'); elName.focus();
  setTimeout(()=>elName.classList.remove('shake'),400);
  return false;
}
elName.addEventListener('input',()=>elName.classList.remove('invalid'));
async function onNext(){
  if(phase===1){ if(!requireName()) return; chosenChar=roster[sel].id; window.__sel.char=chosenChar; window.__sel.name=elName.value.trim(); await goPhase(2); }
  else if(phase===2){ if(!requireName()) return; chosenFollower=roster[sel].id; window.__sel.follower=chosenFollower; window.__sel.followerName=elName.value.trim(); await goPhase(3); }
  else { chosenFaction=FACTIONS[factionSel].id; window.__sel.faction=chosenFaction;
    // ★출항 = 오프닝 골든패스 단일 진입(game.html?opening=1) — caravel 전투→난파→표류→깨어남→'클릭하여 일어나기'→그 자리(홈섬 해안)서 게임 시작. 페이지 이동/중간 로딩 없음.
    //   ⚠️ 공개 배포 시 게임을 막으려면 아래를 데모 스텁으로 다시 닫을 것(btnNext '데모 버전 · 게임 준비 중' + return).
    const nm=window.__sel.name||'선장', fnm=window.__sel.followerName||'동료';
    // ★스폰섬 랜덤배정(2026-07-10, 카브 특수취급 폐지) — "시작의 섬 카브"는 해역 이름일 뿐 실제 섬이 아니었음.
    //   실제 게임서버처럼: worldmap.canon.json의 isSpawn 섬 중 하나를 이 캐릭터에 랜덤배정 → home=<isle.id>로 바인딩(이후 이어하기마다 같은 섬).
    let homeIsle=null;
    try{ const canon=await fetch('worldmap.canon.json').then(r=>r.json());
      const spawns=(canon.islands||[]).filter(i=>i.isSpawn);
      if(spawns.length) homeIsle=spawns[Math.floor(Math.random()*spawns.length)]; }
    catch(e){ console.warn('[select] canon 스폰섬 조회 실패, 폴백 사용', e&&e.message); }
    const testMap = new URLSearchParams(location.search).get('testMap') || '';
    const isCliffHarborTest = testMap === 'cliff-harbor';
    const isSeaKeepTest = testMap === 'sea-keep';
    const sName = isSeaKeepTest ? '테스트섬 Sea Keep' : (isCliffHarborTest ? '테스트섬 절벽항구' : (homeIsle ? homeIsle.prefab : '시작의섬 카브'));   // 못 찾으면(구맵 등) 구 폴백 유지
    const homeId = (isCliffHarborTest || isSeaKeepTest) ? '' : (homeIsle ? homeIsle.id : '');
    //   stream=1 = 오픈월드 섬 스트리밍 활성(퀘스트라인 Q7~Q8 '첫 섬 점령'이 근처 부족 섬 스트림인+거점 등록에 의존).
    // 테스트맵은 섬 탐색감만 빠르게 판정: 오프닝·퀘스트·원거리 스트리밍을 끄고 단일 섬에 바로 스폰한다.
    const mode = (isCliffHarborTest || isSeaKeepTest) ? 'opening=0&quest=0&stream=0&combat=0' : 'opening=1&quest=1&stream=1';
    const test = testMap ? `&testMap=${encodeURIComponent(testMap)}` : '';
    const seaKeep = new URLSearchParams(location.search).get('seaKeep') === '1' ? '&seaKeep=1' : '';
    const url=`game.html?${mode}${test}${seaKeep}&s=${encodeURIComponent(sName)}&home=${encodeURIComponent(homeId)}&char=${encodeURIComponent(chosenChar)}&follower=${encodeURIComponent(chosenFollower)}&faction=${encodeURIComponent(chosenFaction)}&name=${encodeURIComponent(nm)}&followerName=${encodeURIComponent(fnm)}`;
    window.__sel.go=url; location.href=url; }
}
async function onBack(){ if(phase===3) await goPhase(2); else if(phase===2) await goPhase(1); else location.href='intro/_journey.html'; }   // 첫 단계 BACK → 인트로(_journey)

addEventListener('keydown',e=>{
  if(LB && LB.style.display!=='none'){   // 🎭 로비 모드 키: Enter=게임시작 / 방향=캐릭터 이동
    if(e.code==='Enter') lbStartGame();
    else if(e.code==='ArrowLeft'||e.code==='ArrowUp') lbSelect(lbSel-1);
    else if(e.code==='ArrowRight'||e.code==='ArrowDown') lbSelect(lbSel+1);

  if(e.code==='Enter'){ onNext(); return; }
  if(e.target===elName) return;
  const cur = phase===3 ? factionSel : sel;

  else if(e.code==='Escape') onBack();
  else if(/^Digit[1-9]$/.test(e.code)){ const i=+e.code.slice(5)-1; if(phase===3){ if(i<FACTIONS.length) selectFaction(i); } else if(i<roster.length) selectIndex(i); }
});

window.__back=()=>onBack();
window.__selReady=false;
window.__playFx=(k)=>{ try{ fx.play(k); return true; }catch(e){ window.__fxErr=String(e&&e.message||e); return false; } };
window.__sceneObjs=()=>scene.children.length;
window.__modelPosY=()=>showModel?+showModel.position.y.toFixed(3):null;
window.__dumpBones=()=>{ const list=[]; if(!showModel) return {posY:null,list}; showModel.updateMatrixWorld(true);
  showModel.traverse(o=>{ if(o.isBone){ const v=new THREE.Vector3(); o.getWorldPosition(v); list.push({name:o.name, wy:v.y}); } });
  return { posY:+showModel.position.y.toFixed(3), list }; };
window.__dumpModel=()=>{ const out=[]; if(!showModel) return out;
  showModel.updateMatrixWorld(true);
  showModel.traverse(o=>{ if(!(o.isMesh||o.isSkinnedMesh)) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    const bb=new THREE.Box3().setFromObject(o); const sz=new THREE.Vector3(); bb.getSize(sz);
    mats.forEach((mt,k)=>{ if(!mt) return;
      out.push({ name:o.name||'(noname)', mat:k, type:mt.type, vis:o.visible,
        col:mt.color?('#'+mt.color.getHexString()):'-', map:!!mt.map, side:mt.side, blend:mt.blending,
        topY:+bb.max.y.toFixed(2), botY:+bb.min.y.toFixed(2), h:+sz.y.toFixed(2) }); });
  });
  return out; };

// ── 🎭 캐릭터 선택 로비 (세이브 로스터) — 3D 스테이지 재활용 ──
const LB=document.getElementById('lobby'), lbList=document.getElementById('lbList');
let lbChars=[], lbSel=0, _delArm=false, _delT=null;
function lbLoadRoster(){ try{ let l=JSON.parse(localStorage.getItem('voyageRoster_v1')||'[]'); if(!Array.isArray(l)) l=[];
  if(!l.length){ const old=localStorage.getItem('voyageSave_v1'); if(old){ try{ const s=JSON.parse(old); if(s){ if(!s.cid) s.cid='c_'+Date.now().toString(36); l=[s]; localStorage.setItem('voyageRoster_v1',JSON.stringify(l)); } }catch(_){} } }
  return l.slice().sort((a,b)=>((b&&b.t)||0)-((a&&a.t)||0)); }catch(e){ return []; } }
function lbClass(id){ const canonical=normalizeClassId(id); return CLASS_ROSTER.find(c=>c.id===canonical) || CLASS_ROSTER[0]; }
function lbBuild(){ lbList.innerHTML='';
  lbChars.forEach((c,i)=>{ const m=c.meta||{}, cls=lbClass(m.char), lvl=(c.combat&&c.combat.level)||1, gold=(c.inventory&&c.inventory.gold)||0;
    const fac = m.faction==='remnant'?'남은 자':(m.faction==='watch'?'파수꾼':'');
    const el=document.createElement('div'); el.className='lb-card'+(i===lbSel?' on':''); el.dataset.i=i;
    el.innerHTML=`${i===lbSel?'<div class="lb-crown">👑</div>':''}<div class="lb-em" style="background-image:url('${cls.icon}')"></div>`
      +`<div class="lb-info"><div class="lb-nm">${m.name||'이름 없음'}</div><div class="lb-cls">${cls.nm}${fac?' · '+fac:''}</div>`
      +`<div class="lb-meta"><span>Lv <b>${lvl}</b></span><span>◎ <b>${gold}</b></span></div></div>`;
    el.onclick=()=>lbSelect(i); lbList.appendChild(el); }); }
function lbSelect(i){ if(!lbChars.length) return; lbSel=((i%lbChars.length)+lbChars.length)%lbChars.length;
  [...lbList.children].forEach((el,k)=>{ el.classList.toggle('on',k===lbSel); const cr=el.querySelector('.lb-crown');
    if(k===lbSel && !cr){ const d=document.createElement('div'); d.className='lb-crown'; d.textContent='👑'; el.appendChild(d); }
    else if(k!==lbSel && cr){ cr.remove(); } });
  setShowcase(lbClass((lbChars[lbSel].meta||{}).char), false); }   // 선택 캐릭터 클래스 3D
function lbStartGame(){ const c=lbChars[lbSel]; if(!c) return; const m=c.meta||{}, e=encodeURIComponent;
  document.getElementById('load').style.display='flex';
  // 테스트맵 주소로 로비에 들어온 경우 기존 세이브의 session/position을 복원하면 이전 테스트 섬으로 되돌아간다.
  // 외형 선택만 재사용하고, 테스트 세션은 신규 진입과 동일하게 별도 로드한다.
  const testMap=new URLSearchParams(location.search).get('testMap')||'';
  if(testMap==='sea-keep'||testMap==='cliff-harbor'){
    const session=testMap==='sea-keep'?'테스트섬 Sea Keep':'테스트섬 절벽항구';
    location.href='game.html?opening=0&quest=0&stream=0&combat=0&build=20260806e&testMap='+e(testMap)
      +'&s='+e(session)+'&home=&char='+e(normalizeClassId(m.char))+'&follower='+e(m.follower||'')
      +'&faction='+e(m.faction||'')+'&name='+e(m.name||'')+'&followerName='+e(m.followerName||'');
    return;
  }
  const seaKeep=new URLSearchParams(location.search).get('seaKeep')==='1'?'&seaKeep=1&build=20260806j':'';
  location.href='game.html?load=1&quest=1&stream=1&cid='+e(c.cid||'')+seaKeep
    +'&s='+e(m.session||'시작의섬 카브')+'&home='+e(m.homeIslandId||'')+'&char='+e(normalizeClassId(m.char))+'&follower='+e(m.follower||'')
    +'&faction='+e(m.faction||'')+'&name='+e(m.name||'')+'&followerName='+e(m.followerName||''); }
async function lbNewChar(){ LB.style.display='none'; document.body.classList.remove('lobbymode'); await goPhase(1); }
function lbDelChar(){ const c=lbChars[lbSel]; if(!c) return; const btn=document.getElementById('lbDel');
  if(!_delArm){ _delArm=true; btn.textContent='정말 삭제? (다시 클릭)'; clearTimeout(_delT); _delT=setTimeout(()=>{ _delArm=false; btn.textContent='🗑 삭제'; },2500); return; }
  _delArm=false; clearTimeout(_delT); btn.textContent='🗑 삭제';
  try{ let l=lbLoadRoster().filter(x=>x.cid!==c.cid); localStorage.setItem('voyageRoster_v1',JSON.stringify(l)); if(!l.length) localStorage.removeItem('voyageSave_v1'); }catch(_){}
  lbChars=lbLoadRoster();
  if(!lbChars.length){ lbNewChar(); return; }
  lbSel=Math.min(lbSel,lbChars.length-1); lbBuild(); lbSelect(lbSel); }
document.getElementById('lbStart').onclick=lbStartGame;
document.getElementById('lbNew').onclick=lbNewChar;
document.getElementById('lbDel').onclick=lbDelChar;

(async()=>{
  lbChars = lbLoadRoster();
  if(lbChars.length){   // 💾 세이브 있음 → 캐릭터 선택 로비 먼저(생성 흐름 대신)
    document.body.classList.add('lobbymode');
    lbBuild(); LB.style.display='flex';
    document.getElementById('load').style.display='none';
    window.__selReady=true; loop();
    lbSelect(0);   // loop 시작 후 첫 캐릭터 3D 표시(setShowcase 비동기)
  } else {              // 세이브 없음 → 신규 생성 흐름
    await goPhase(1);
    document.getElementById('load').style.display='none';
    window.__selReady=true; loop();
  }
})();
</script>
</body></html>
