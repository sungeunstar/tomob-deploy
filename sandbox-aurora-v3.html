*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8cfd7;color:#f6f1dd;font:13px/1.55 system-ui,'Malgun Gothic',sans-serif}canvas{display:block}button,select,a{font:inherit}button,select,a.control{background:#173139d9;color:inherit;border:1px solid #ffffff30;border-radius:5px;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,a.control:hover{background:#34544e}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #e5cf91;outline-offset:2px}#hud{position:fixed;left:24px;top:20px;z-index:5;pointer-events:none;text-shadow:0 2px 6px #173438}.eyebrow{font-size:10px;letter-spacing:2px;color:#e5d4aa}h1{font-size:25px;letter-spacing:-1px;font-weight:550;margin:2px 0}#location{color:#e8d6ac}#pos{font:10px ui-monospace,monospace;opacity:.6;margin-top:6px}#tools{position:fixed;top:20px;right:20px;z-index:20;display:flex;gap:7px;align-items:start}details{background:#173139df;border:1px solid #ffffff2a;border-radius:5px}summary{cursor:pointer;padding:8px 12px}.inner{display:grid;gap:8px;padding:5px 12px 12px}small{opacity:.7}#hint{position:fixed;left:24px;bottom:26px;z-index:5;pointer-events:none;background:#18343ac9;border-left:2px solid #ddc58b;padding:11px 16px;max-width:320px}#hint b{color:#ebd399}#fps{position:fixed;right:20px;bottom:22px;z-index:5;background:#19353dbf;padding:6px 9px;font:11px ui-monospace,monospace}#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#ffffff95;z-index:4;pointer-events:none}#load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#142c35;gap:15px;padding:25px;text-align:center}#load h2{font-size:32px;font-weight:500;margin:0}progress{width:220px;accent-color:#aebe95}#qa{display:none;position:fixed;right:20px;top:190px;max-width:450px;max-height:62vh;overflow:auto;background:#102329ef;color:#b8ddc3;font:11px/1.4 ui-monospace,monospace;padding:12px;white-s <script>window.__auroraErrors=[];const oldError=console.error.bind(console);console.error=(...args)=>{const s=args.map(String).join(' ');if(!window.__auroraErrors.includes(s)&&window.__auroraErrors.length<40)window.__auroraErrors.push(s);oldError(...args);};addEventListener('error',e=>window.__auroraErrors.push(e.message));addEventListener('unhandledrejection',e=>window.__auroraErrors.push(String(e.reason)));</script>

<div id="load"><small>TOMOB / ISLAND STUDY 03</small><h2>바람의 유적섬</h2><div id="load-note">본편 엔진을 준비하는 중</div><progress></progress><small>기존 광산·건물 에셋을 불러옵니다.</small></div>
<div id="hud"><div class="eyebrow">TOMOB / ISLAND STUDY 03</div><h1>바람의 유적섬</h1><div id="location">해안 산책로</div><div id="pos"></div></div>
<div id="tools"><a class="control" id="overview" href="?view=overview">섬 전체 보기</a><details><summary>장소 둘러보기</summary><div class="inner"><select id="places" aria-label="장소 선택"><option value="">장소 선택</option></select><button id="reset">선착장으로</button><button id="native-test">본편 이동 검사</button><small>장소 이동은 검수용입니다.</small><a href="./sandbox-aurora.html">이전 버전과 비교</a></div></details></div>

<script type="module">
import * as THREE from 'three';
import {initCore} from './modules/core.js';
import {initPhysics} from './modules/physics.js';
import {initWater} from './modules/water.js';
import {initInput} from './modules/input.js';
import {initPlayer,KAY_CHARS} from './modules/player.js';
import {initAuroraRefined} from './modules/aurora-refined.js?v=3a';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),overview=q.get('view')==='overview',delay=ms=>new Promise(r=>setTimeout(r,ms));
try{
 const ctx=initCore();window.ctx=ctx;ctx.renderer.outputColorSpace=THREE.SRGBColorSpace;ctx.renderer.toneMapping=THREE.ACESFilmicToneMapping;ctx.renderer.toneMappingExposure=1.10;
 ctx.scene.background=new THREE.Color('#abd1d8');ctx.scene.fog=new THREE.FogExp2('#abd1d8',.00115);ctx.hemi.color.set('#e3eff8');ctx.hemi.groundColor.set('#7b8d66');ctx.hemi.intensity=1.55;ctx.sun.color.set('#ffebcf');ctx.sun.intensity=2.35;ctx.sun.position.set(-100,180,105);ctx.sun.shadow.normalBias=.08;ctx.sun.shadow.bias=-.0001;Object.assign(ctx.sun.shadow.camera,{left:-145,right:145,top:145,bottom:-145,near:1,far:450});ctx.sun.shadow.camera.updateProjectionMatrix();ctx.fill.intensity=.4;ctx.fill.color.set('#bedbe7');ctx.amb.intensity=.12;
 $('load-note').textContent='지형과 기존 건물을 불러오는 중';await initPhysics(ctx);initWater(ctx);initInput(ctx);const island=await initAuroraRefined(ctx);const character=KAY_CHARS[q.get('char')]||KAY_CHARS.knight;initPlayer(ctx,{spawn:island.spawn,charUrl:character});ctx.player.setThird(true);ctx.stepPhysics();
 let frames=0,fps=0,count=0,last=performance.now(),ready=false,inspection=null;
 function go(id){const p=island.field.points.find(p=>p.id===id);if(!p)return;ctx.player.setSpawn(p.x,island.groundAt(p.x,p.z,p.y+2)+2.3,p.z);inspection=p;$('location').textContent=p.name;$('places').value=p.id;}
 for(const p of island.field.points){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('places').appendChild(o);} $('places').onchange=()=>go($('places').value);$('reset').onclick=()=>{ctx.player.setSpawn(island.spawn.x,island.spawn.y,island.spawn.z);inspection=null;};
 const url=new URL(location.href);overview?url.searchParams.delete('view'):url.searchParams.set('view','overview');$('overview').href=url.href;$('overview').textContent=overview?'본편 조작으로 탐험':'섬 전체 보기';
 if(overview){$('cross').style.display='none';$('hint').textContent='장소를 선택하면 가까이 볼 수 있어요. 직접 탐험은 본편 조작 버튼을 눌러주세요.';ctx.onUpdate(()=>{ctx.camera.fov=43;ctx.camera.updateProjectionMatrix();if(inspection){const p=inspection;ctx.camera.position.set(p.x+29,p.y+25,p.z+37);ctx.camera.lookAt(p.x,p.y+3,p.z);}else{ctx.camera.position.set(181,164,226);ctx.camera.lookAt(0,15,0);}});}
 ctx.onUpdate(()=>ctx.stepPhysics());
 const report=()=>{const p=ctx.player.pos;return{build:'aurora-v3-native-assets',ready,controller:'modules/player.js (unmodified)',physics:'modules/physics.js (unmodified)',mode:overview?'overview':'native-play',characterReady:typeof window.__curAnim==='function',animation:window.__curAnim?.()||null,position:{x:+p.x.toFixed(3),y:+p.y.toFixed(3),z:+p.z.toFixed(3)},ground:+island.groundAt(p.x,p.z,p.y+.2).toFixed(3),assets:island.assets,details:island.detailStats,bvh:!!island.bvh,drawCalls:ctx.renderer.info.render.calls,triangles:ctx.renderer.info.render.triangles,wallClockFPS:fps,frames,errors:window.__auroraErrors.slice(-8),nativeTest:window.__auroraQA?.testResult||null};};
 ctx.onUpdate(()=>{frames++;count++;const now=performance.now();if(now-last>=700){fps=+(count*1000/(now-last)).toFixed(1);count=0;last=now;const p=ctx.player.pos;$('pos').textContent=`${p.x.toFixed(0)}, ${p.z.toFixed(0)} · ${p.y.toFixed(1)}m`;$('fps').textContent=`${fps} FPS`;if(q.has('qa')){$('qa').style.display='block';$('qa').textContent=JSON.stringify(report(),null,2);}}});
 function waitSim(seconds,observe){return new Promise((resolve,reject)=>{let total=0;const watchdog=setTimeout(()=>{ctx.offUpdate(f);reject(new Error('Not enough rendered simulation frames; test inconclusive.'));},25000);const f=ctx.onUpdate(dt=>{total+=dt;observe?.();if(total>=seconds){clearTimeout(watchdog);ctx.offUpdate(f);resolve();}});});}
 async function nativeTest(){if(overview||!ready)return;const canvas=ctx.renderer.domElement;$('native-test').disabled=true;const emit=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,bubbles:true})),samples=[];try{await canvas.requestPointerLock();await waitSim(.25);if(document.pointerLockElement!==canvas)throw new Error('Pointer lock not granted.');const sample=tag=>{const r=report();samples.push({tag,position:r.position,animation:r.animation,frames:r.frames});};sample('idle');emit('keydown','KeyW');await waitSim(.35);sample('walk');emit('keydown','ShiftLeft');await waitSim(.35);sample('run');emit('keyup','ShiftLeft');emit('keyup','KeyW');await waitSim(.3);const start=ctx.player.pos.y;let peak=start;const clips=new Set();emit('keydown','Space');await waitSim(.9,()=>{peak=Math.max(peak,ctx.player.pos.y);clips.add(window.__curAnim?.());});emit('keyup','Space');sample('land');const moved=Math.hypot(samples[1].position.x-samples[0].position.x,samples[1].position.z-samples[0].position.z),jumpDelta=peak-start;window.__auroraQA.testResult={moved,jumpDelta,clips:[...clips],samples,pass:moved>.2&&jumpDelta>.15&&[...clips].some(c=>/Jump/.test(c||''))};}catch(e){window.__auroraQA.testResult={pass:false,reason:e.message,samples};}finally{for(const c of['KeyW','ShiftLeft','Space'])emit('keyup',c);$('native-test').disabled=false;document.exitPointerLock?.();}}
 window.__auroraQA={ctx,island,report,go,nativeTest,testResult:null};if(q.has('qa')){$('native-test').style.display='block';$('native-test').onclick=nativeTest;}
 ctx.start();await island.ready;for(let i=0;i<100&&!window.__curAnim;i++){await delay(250);}ready=true;document.body.dataset.ready='true';$('load').remove();if(island.assets.errors.length)$('notice').textContent='일부 에셋 로드 실패 — 진단 화면에서 확인할 수 있어요.';if(!window.__curAnim)$('notice').textContent='캐릭터 애니메이션을 계속 불러오는 중입니다.';console.info('[aurora-v3]',report());
}catch(e){console.error('[aurora-v3 boot]',e);$('load-note').textContent='초기화 실패: '+e.message;$('load').querySelector('progress')?.remove();}
</script></body></html>
