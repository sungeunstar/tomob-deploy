name: Windgate 17 reset exterior verification
on:
  push:
    branches: [main]
    paths:
      - 'modules/windgate17-authored-exterior.js'
      - 'modules/windgate17-summit-manual.js'
      - 'modules/aurora-refuge-v17.js'
      - 'sandbox-aurora-v17.html'
      - 'scripts/qa-windgate17.mjs'
      - '.github/workflows/windgate17-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windgate17-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check modules/windgate17-authored-exterior.js
          node --check modules/windgate17-summit-manual.js
          node --check modules/aurora-refuge-v17.js
      - name: Browser tooling
        run: |
          mkdir -p /tmp/wg17 && cd /tmp/wg17
          npm init -y
          npm install --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
          ln -s /tmp/wg17/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Render and native movement
        run: node scripts/qa-windgate17.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windgate17-reset-evidence
          path: artifacts/windgate17
          retention-days: 7
          if-no-files-found: warn
