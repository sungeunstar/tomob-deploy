name: Windgate 12 portal-back passage verification
on:
  push:
    branches: [main]
    paths:
      - 'modules/aurora-passage-v12.js'
      - 'modules/windgate12-canyon-runtime.js'
      - 'sandbox-aurora-v12.html'
      - 'scripts/qa-windgate12.mjs'
      - '.github/workflows/windgate12-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windgate12-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check authored sample syntax
        run: |
          node --check modules/aurora-passage-v12.js
          node --check modules/windgate12-canyon-runtime.js
      - name: Prepare browser tooling
        run: |
          mkdir -p /tmp/windgate12-tools
          cd /tmp/windgate12-tools
          npm init -y
          npm install --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
          ln -s /tmp/windgate12-tools/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Render and traverse actual game sample
        run: node scripts/qa-windgate12.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windgate12-render-and-gameplay
          path: artifacts
          retention-days: 7
          if-no-files-found: warn
