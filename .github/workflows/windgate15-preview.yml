name: Windgate 15 carved mine verification
on:
  push:
    branches: [main]
    paths:
      - 'modules/aurora-refuge-v15.js'
      - 'modules/aurora-refuge-polish-v15.js'
      - 'modules/windgate15-mine-runtime.js'
      - 'sandbox-aurora-v15.html'
      - 'scripts/qa-windgate15.mjs'
      - '.github/workflows/windgate15-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check modules/aurora-refuge-v15.js
          node --check modules/aurora-refuge-polish-v15.js
          node --check modules/windgate15-mine-runtime.js
      - run: |
          mkdir -p /tmp/wg15 && cd /tmp/wg15
          npm init -y
          npm install --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
          ln -s /tmp/wg15/node_modules "$GITHUB_WORKSPACE/node_modules"
      - run: node scripts/qa-windgate15.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windgate15-mine-evidence
          path: artifacts/windgate15
          retention-days: 7
          if-no-files-found: warn
