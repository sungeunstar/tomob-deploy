<!doctype html><html lang="ko"><head><base href="/tomob-deploy/">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAS Voyage — 오프닝</title>
<!--
  voyage/intro/index.html — 게임 오프닝 랜딩(1섹션 완성: 항해/타륜).
  토대: GSAP ScrollTrigger(scrub+snap) + 게임 모듈(../modules/core·physics·water·ship) 그대로.
  흐름: 수면 위 배(히어로) → 무겁게 스크롤 → 수면 통과 전환(물보라) → 수중 잠수, 타륜이 서서히 등장 + 설명 카드.
  ★바다·배·하늘 = 게임 water.js/ship.js. 오브젝트 = 게임 에셋 /ship_helm.glb. 새로 만들지 않음.
  스크롤 = 휠 따라가기 아님 → ScrollTrigger snap(섹션 스냅) + scrub(관성/무게감).
  UI 톤: JWE 헥스 블루 HUD + 맵 정본 시안/네이비 글래스.
  검증 계약: window.__introReady / window.__introGo(i) / window.__ctx / window.__helm 노출.
-->
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css");
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");
  :root{
    --navy:#06141f; --navy2:#0a1f30; --panel:rgba(9,28,44,.82);
    --cyan:#41c6e0; --cyan-bright:#9bf0f8; --cyan-dim:#5a93a8;
    --gold:#f0c64a; --line:rgba(80,200,225,.42); --line-soft:rgba(80,200,225,.18);
    --txt:#dcf0f6; --txt-dim:rgba(180,222,233,.58);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  /* ScrollTrigger 토대: body 스크롤 허용(overflow:hidden 금지). 캔버스는 fixed로 깔고 500vh 컨테이너가 스크롤을 만든다. */
  body{background:var(--navy);color:var(--txt);font-family:'Montserrat','Pretendard',system-ui,sans-serif;cursor:default;overscroll-behavior:none}
  canvas{position:fixed!important;top:0;left:0;width:100vw;height:100vh;z-index:0;display:block}
  /* 스크롤 길이 컨테이너 — 1000vh. ★섹션 간 거리를 크게 잡아 단일 휠 제스처로 섹션이 안 넘어가게(휠 ~2회 체감).
     관성/이징 느낌(scrub+ease)은 그대로 유지(사령관: 무게감은 정답). */
  #scroll{position:relative;height:600vh;z-index:1;pointer-events:none}  /* 1000→600vh: 스크롤 양 줄임(사령관: 너무 많았음). 묵직함은 scrub/snap이 유지 */
  #ui{position:fixed;inset:0;z-index:5;pointer-events:none}

  /* ── 코너 프레임(JWE 헥스 HUD) ── */
  .frame{position:fixed;z-index:4;width:38px;height:38px;border:2px solid var(--line);opacity:.55}
  .frame.tl{left:16px;top:16px;border-right:0;border-bottom:0}
  .frame.tr{right:16px;top:16px;border-left:0;border-bottom:0}
  .frame.bl{left:16px;bottom:16px;border-right:0;border-top:0}
  .frame.br{right:16px;bottom:16px;border-left:0;border-top:0}

  /* ── 로고 + 메타 ── */
  .logo{position:fixed;left:34px;top:28px;font-size:20px;letter-spacing:.18em;font-weight:300;z-index:5;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .logo b{font-weight:800;color:var(--cyan);letter-spacing:.08em}
  .logo .tab{display:inline-block;width:8px;height:15px;margin-right:9px;vertical-align:-2px;background:var(--cyan);
             clip-path:polygon(0 0,100% 25%,100% 75%,0 100%);box-shadow:0 0 10px var(--cyan)}
  .metaTR{position:fixed;right:32px;top:30px;z-index:5;font:10px/1.7 'Montserrat','Pretendard',sans-serif;letter-spacing:.22em;color:var(--txt-dim);text-align:right}
  /* 좌하단 모노 텔레메트리(JWE //EXP/STATUS 식) */
  .telem{position:fixed;left:34px;bottom:34px;z-index:5;font:10px/1.7 'Montserrat','Pretendard',sans-serif;letter-spacing:.16em;color:var(--cyan-dim);opacity:.8}
  .telem b{color:var(--cyan-bright);font-weight:400}

  /* ── 히어로 ── */
  .hero{position:fixed;left:50%;top:15%;transform:translateX(-50%);text-align:center;z-index:5;text-shadow:0 2px 26px rgba(0,18,30,.92),0 1px 3px rgba(0,12,22,.7);will-change:opacity,transform}
  /* 소견A: 텍스트 뒤 아주 은은한 방사형 어둠 백드롭(박스 아님 — 가장자리로 완전히 사라지는 그라디언트)으로 가독성↑ */
  .hero::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:150vw;height:62vh;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse 42% 58% at 50% 50%, rgba(4,18,30,.5), rgba(4,18,30,.26) 45%, rgba(4,18,30,0) 75%)}
  .hero .kicker{font:11px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.26em;color:var(--cyan-bright);margin-bottom:18px}
  .hero h1{margin:0;font-size:clamp(36px,5.5vw,64px);font-weight:200;letter-spacing:.02em;line-height:1.12}
  .hero h1 b{font-weight:800}
  .hero .rule{width:130px;height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
  .hero p{margin:15px 0 0;font-size:13px;letter-spacing:.26em;color:var(--txt-dim)}
  /* ── 게임 타이틀 + 메뉴(메인 메뉴 화면) ── */
  .hero .gtitle{margin:6px 0 0;font-size:clamp(46px,8vw,96px);font-weight:200;letter-spacing:.05em;line-height:1.0;text-shadow:0 2px 30px rgba(0,18,30,.9)}
  .hero .gtitle b{font-weight:800;color:var(--cyan)}
  .hero .gsub{margin:16px 0 0;font-size:15px;letter-spacing:.08em;color:#e4f3f8;font-weight:500}
  .menu{margin-top:28px;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:auto}
  /* ★엘든링 세로 메뉴 스타일(ref/스타트화면2): 박스 없음 · 발광 텍스트 · hover 시 아래 광원 */
  .mbtn{background:none;border:0;cursor:pointer;position:relative;padding:9px 44px;
        font:16px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.3em;font-weight:500;text-align:center;
        color:rgba(238,230,212,.64);transition:color .2s,text-shadow .2s,letter-spacing .2s}
  /* ★ER식: 글씨 '가운데를 관통'하는 가로 광원(아래 뭉침 X). 중앙 최대 밝기→좌우 페이드, 얇은 가로 띠. */
  .mbtn::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:94px;pointer-events:none;z-index:-1;
        background:radial-gradient(ellipse 56% 20% at 50% 50%, rgba(255,206,124,.6), rgba(255,206,124,0) 70%);transition:width .34s ease}
  .mbtn::after{display:none}
  /* ★게임식 선택 커서(호버 아님): 현재 선택 항목만 .active로 활성 — 엘든링식 가운데 관통 가로 광원 */
  .mbtn.active{color:#fff;text-shadow:0 0 34px rgba(255,228,165,.95), 0 0 8px rgba(255,228,165,.6);letter-spacing:.36em}
  .mbtn.active::before{width:640px}

  /* ── 스크롤 힌트 ── */
  .scrollhint{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);text-align:center;z-index:5;
              font:11px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.28em;color:rgba(200,238,245,.85);will-change:opacity}
  .scrollhint .chev{display:block;margin-top:10px;font-size:16px;color:var(--cyan);animation:bob 1.7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(6px);opacity:1}}

  /* ── 수심 게이지(우측 — 잠수 진행 표시, JWE 모노 톤) ── */
  .depth{position:fixed;right:34px;top:50%;transform:translateY(-50%);z-index:5;width:46px;text-align:center;
         font:10px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.12em;color:var(--cyan-dim);opacity:.85;will-change:opacity}
  .depth .bar{position:relative;width:2px;height:160px;margin:10px auto;background:var(--line-soft)}
  .depth .fill{position:absolute;left:-1px;top:0;width:4px;height:0;background:linear-gradient(180deg,var(--cyan-bright),var(--cyan));box-shadow:0 0 8px var(--cyan)}
  .depth .val{color:var(--cyan-bright);font-size:11px;letter-spacing:.06em}

  /* ── 설명(에디토리얼 미니멀 — three.js 사이트식: 박스 없음 · 인덱스 워터마크 · 제목 reveal) ── */
  .card{position:fixed;left:7%;bottom:13%;width:min(42vw,470px);z-index:5;opacity:0;pointer-events:none;
        will-change:opacity;transition:opacity .5s ease}
  /* 가독성: 화면 하단 전체 vignette(카드별 박스 아님 → 잘림 없음, 게임 사이트식) */
  #cardvig{position:fixed;left:0;right:0;bottom:0;height:46%;z-index:4;pointer-events:none;opacity:0;transition:opacity .5s ease;
        background:linear-gradient(0deg, rgba(2,10,18,.6), rgba(2,10,18,.16) 46%, rgba(2,10,18,0))}
  .card .cidx{font:200 clamp(54px,7vw,102px)/.85 'Montserrat','Pretendard',sans-serif;color:rgba(175,222,235,.10);letter-spacing:-.02em}
  .card .klabel{font:11px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.44em;color:var(--cyan);text-transform:uppercase;margin-top:4px}
  .card .titwrap{overflow:visible;margin:8px 0 0}
  /* ★lusion/igloo식 우아한 blur→선명 + 미세 스케일 페이드(글리치 아님) */
  .card h2{margin:0;font-size:clamp(30px,4.2vw,54px);font-weight:800;color:#eef8fc;letter-spacing:.02em;line-height:1.04;text-shadow:0 2px 26px rgba(0,18,30,.85);
           opacity:0;filter:blur(16px);transform:scale(1.035) translateY(10px);
           transition:opacity .9s ease,filter .95s ease,transform 1.05s cubic-bezier(.19,.9,.22,1)}
  .card.reveal h2{opacity:1;filter:blur(0);transform:none}
  .card .cline{height:1px;width:0;margin:18px 0 15px;background:linear-gradient(90deg,var(--cyan),transparent);transition:width .85s ease .12s}
  .card p{margin:0;font-size:15px;line-height:1.85;color:#d3e8ef;max-width:34ch;opacity:0;transform:translateY(12px);transition:opacity .7s ease .28s,transform .7s ease .28s}
  .card.reveal h2{transform:translateY(0)}
  .card.reveal .cline{width:132px}
  .card.reveal p{opacity:1;transform:translateY(0)}
  /* ★좌우 교차: 짝수 섹션은 우측 정렬 */
  .card.right{left:auto;right:7%;text-align:right}
  .card.right .titwrap{display:flex;justify-content:flex-end}
  .card.right .cline{margin-left:auto}
  .card.right p{margin-left:auto}
  /* ★우측 섹션 인디케이터(게임 사이트식) */
  #secnav{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:18px;opacity:0;pointer-events:none;transition:opacity .5s ease}
  #secnav.on{opacity:1;pointer-events:auto}
  #secnav button{display:flex;align-items:center;justify-content:flex-end;gap:9px;background:none;border:0;cursor:pointer;
    color:rgba(200,230,240,.38);font:10px/1 'Montserrat','Pretendard',sans-serif;letter-spacing:.22em;transition:color .3s}
  #secnav button i{font-style:normal;opacity:.7}
  #secnav button span{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .35s ease,opacity .35s ease}
  #secnav button::after{content:'';width:16px;height:1px;background:currentColor;opacity:.55;transition:width .3s}
  #secnav button.active{color:var(--cyan)}
  #secnav button.active span{max-width:120px;opacity:1}
  #secnav button.active::after{width:30px}

  /* ── 로딩 ── 🏮 내용은 /modules/loadscreen.js가 채운다(game·select와 동일 화면).
     여기 배경은 모듈 로드 전 첫 프레임에 남색이 번쩍이지 않게 하려는 것. */
  #load{position:fixed;inset:0;z-index:9999;background:#050505 url('/ui/loading_bg.png') center/cover no-repeat}
</style></head>
<body>
<div id="load"></div>

<!-- 실제 스크롤 길이 — ScrollTrigger가 이 컨테이너로 진행도를 만든다 -->
<div id="scroll"></div>

<!-- HUD -->
<div class="frame tl"></div><div class="frame tr"></div><div class="frame bl"></div><div class="frame br"></div>
<div class="logo"><img src="/intro/logo.png" alt="tomob" style="height:74px;vertical-align:middle;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))"></div>
<div class="telem">//NAV/STATUS<br>DEPTH&nbsp;&nbsp;<b id="tDepth">00.0</b> M<br>SECTOR&nbsp;<b>01 / 05</b></div>

<div id="ui">
  <div class="hero" id="hero">
    <div class="kicker">THE FIRST STAR · 첫 번째 별</div>
    <img class="gemblem" src="/intro/logo.png" alt="tomob" style="width:min(44vw,420px);margin:4px auto 0;display:block;filter:drop-shadow(0 8px 40px rgba(0,18,30,.95))">
    <p class="gsub">별이 떨어진 뒤 바다가 차오른 세계, 토모브. 가라앉지 않은 마지막 바다 위에서 배를 짓고 항해합니다.</p>
    <div class="menu">
      <button class="mbtn primary" id="btnStart">▸ START GAME</button>
      <button class="mbtn" id="btnPortfolio">포트폴리오 보기</button>
      <button class="mbtn" id="btnContact">문의하기</button>
    </div>
  </div>

  <div class="scrollhint" id="scrollhint">SCROLL TO DIVE<span class="chev">▾</span></div>

  <div class="depth" id="depthUI">
    <div>SURF</div>
    <div class="bar"><div class="fill" id="depthFill"></div></div>
    <div class="val" id="depthVal">00m</div>
  </div>

  <div id="cardvig"></div>
  <div class="card" id="card">
    <div class="cidx" id="cNum">01</div>
    <div class="klabel" id="cKlabel">SAILING</div>
    <div class="titwrap"><h2 id="cKo">항해</h2></div>
    <div class="cline"></div>
    <p id="cDesc">바람을 읽고 돛을 맞춰 배를 몬다. 이동·탐험·전투·교역 — 모든 것이 배를 통한다.</p>
  </div>

  <div id="secnav">
    <button data-i="0"><i>01</i><span>SAILING</span></button>
    <button data-i="1"><i>02</i><span>TRADE</span></button>
    <button data-i="2"><i>03</i><span>BATTLE</span></button>
    <button data-i="3"><i>04</i><span>EXPLORE</span></button>
    <button data-i="4"><i>05</i><span>FACTION</span></button>
  </div>
</div>

<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "gsap":"https://esm.sh/gsap@3.12.5",
  "gsap/ScrollTrigger":"https://esm.sh/gsap@3.12.5/ScrollTrigger"
}}</script>

<script type="module">
import { initCore }    from '../modules/core.js';
import { initPhysics } from '../modules/physics.js';
import { initWater }   from '../modules/water.js';
import { initShip }    from '../modules/ship.js';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { TessellateModifier } from 'three/addons/modifiers/TessellateModifier.js';   // 촘촘한 삼각 그물용
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
import * as THREE from 'three';
import gsap from 'gsap';
import ScrollTrigger from 'gsap/ScrollTrigger';
gsap.registerPlugin(ScrollTrigger);

const L = document.getElementById('load');
// 🏮 공용 로딩 화면. 여기는 PRELOAD 개수로 실제 진행률을 알 수 있어 setProgress를 직접 준다.
const LS = (await import('/modules/loadscreen.js')).initLoadScreen();
try{
  // ───────────────────────── 씬 ─────────────────────────
  const ctx = initCore({ sky:0x8fc1e3 });
  await initPhysics(ctx);
  const { scene, camera } = ctx;
  camera.position.set(0,9,48);

  // 바다: 게임 water.js (사령관 확정 — three.js Water보다 낫다). 수중 진입 시 청록 안개+비네트 자동.
  initWater(ctx);

  // ★환경맵(PBR 금속/머티리얼이 반사를 받아 수중 어둠서도 또렷) + 은은한 환경광 — 사령관: GLB 어두움/금화 안 보임 지적.
  try{ const pmrem=new THREE.PMREMGenerator(ctx.renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; }
  catch(e){ console.warn('[intro] env map 실패', e&&e.message); }
  const ambHemi=new THREE.HemisphereLight(0x9fd0ec, 0x0a2236, 0.9); scene.add(ambHemi);

  // ── 수면 통과 전환 "베일"(IGLOO 전환.png) : 순간 splash가 아니라 화면 전체를 부드럽게 덮었다 천천히 빠지는 안개/물보라.
  //   산/오브젝트가 안개 사이로 흐릿하게 드러났다 사라지는 느낌 → 화면 전체 미스트 + 위쪽이 더 짙은(수면에서 내려오는) 결.
  //   톤은 무채색 아님(IGLOO는 흰안개, 우리는 시안/네이비). z-index 6 = 수중 비네트와 같은 층.
  const splash=document.createElement('div'); splash.id='splash';
  splash.style.cssText='position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;will-change:opacity;mix-blend-mode:screen;'+
    'background:'+
      'radial-gradient(ellipse 130% 90% at 50% 30%, rgba(214,244,250,.9), rgba(150,214,228,.62) 38%, rgba(58,140,170,.28) 70%, rgba(20,72,104,0) 100%),'+
      'linear-gradient(180deg, rgba(196,236,246,.55), rgba(120,196,214,.18) 45%, rgba(40,110,144,0) 80%)';
  document.body.appendChild(splash);

  // ★수면 윤슬(sparkle) 제거 — 텍스처 없는 THREE.Points가 정사각 "네모"로 렌더됨(사령관 지적). 입자 폐기.

  // ── 배(게임 모듈 그대로) ──
  const SHIP = {
    caravel:{ objUrl:'/obj/caravel-ship/source/model.fbx', length:56, albedoDir:'/obj/caravel-ship/textures/', stripRig:true, center:true, useModelHelm:true, flip:true },
    empty:  { objUrl:'/obj/empty-ship/source/TexturedShip2.fbx', length:56, helmX:-17 },
    oseberg:{},
  };
  const params = new URLSearchParams(location.search);
  const pick = params.get('ship') || 'caravel';
  const UW   = params.get('uw') || 'caustics';   // ★확정: caustics(일렁이는 물빛 ghostty water.glsl). ray(빛줄기)는 ?uw=ray로 비교용 잔존
  const JUMP = params.get('jump');              // 'uw' → 로드 후 수중(타륜)으로 자동 점프(샘플 비교용)

    const setFromKF=(pp)=>{ __pickP=pp; sc.p=sc.tp=pp; const kk=sampleKF(pp);
      ff.pos.set(kk.pos[0],kk.pos[1],kk.pos[2]);
      const d=new THREE.Vector3(kk.look[0]-kk.pos[0],kk.look[1]-kk.pos[1],kk.look[2]-kk.pos[2]).normalize();
      ff.pitch=Math.asin(Math.max(-1,Math.min(1,d.y))); ff.yaw=Math.atan2(d.x,d.z); };
    const pk=document.createElement('div'); pk.id='pickpanel';
    pk.style.cssText='position:fixed;right:14px;top:96px;z-index:40;background:rgba(6,18,28,.92);border:1px solid #41c6e0;'+
      'color:#9bf0f8;font:11px/1.7 Montserrat,Pretendard,sans-serif;padding:12px 14px;white-space:pre;pointer-events:none;min-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.6)';

      const i='1234567'.indexOf(e.key); if(i>=0){ setFromKF(SECT[i][1]); return; }

      if(k==='c'){ const P=ff.pos, L=P.clone().add(ff.fwd.clone().multiplyScalar(50));
        const line=`{ p:${__pickP.toFixed(2)}, pos:[${Math.round(P.x)},${Math.round(P.y)},${Math.round(P.z)}], look:[${Math.round(L.x)},${Math.round(L.y)},${Math.round(L.z)}] },`;

  // (단일 씬 통합 폐기 — _journey 씬 분리 방식으로 복귀. warp/dim 원본 사용)
  const caveProg=0;   // 통합 제거 호환용 상수(항상 0 → 아래 통합 분기 전부 비활성)

  ctx.onUpdate((dt,now)=>{
    // ★마우스 패럴랙스 이징(부드럽게 추종)
    _mp.x += (_mp.tx-_mp.x)*0.045; _mp.y += (_mp.ty-_mp.y)*0.045;
    // ★퍼지는효과: GLB 진입 순간 1회 펄스 → 가운데서 천천히 퍼졌다가 사라짐(계속 안 대도 완주, 재진입 시 재생)
    if(_rippleTargets.length){
      let hitModel=_ripHit;
      if((++_rayTick%2)===0){                       // 2프레임마다 광선교차(호버 반응성↑, 비용 여전히 낮음)
        hitModel=null;
        if(_ptr.x>-1.5){ _ray.setFromCamera(_ptr, camera);
          const hs=_ray.intersectObjects(_rippleTargets.filter(_shown), true);
          if(hs.length){ let o=hs[0].object; while(o && _rippleTargets.indexOf(o)<0) o=o.parent; hitModel=o; } }
        _ripHit=hitModel;
      }
      const isHover=!!hitModel;
      if(isHover && !_ripple.playing){          // 호버 진입 → 그물 성장 시작(중심에서 퍼져 전체를 감쌈)
        const _bs=new THREE.Box3().setFromObject(hitModel).getBoundingSphere(_tmpSph);
        _ripple.hit.copy(_bs.center); _ripple.maxR=_bs.radius*1.18; _ripple.model=hitModel; _ripple.phase=0; _ripple.playing=true; _ripple.depth=Math.abs(camera.position.y);
        _ripple.hudBox=_hud.calc(hitModel);     // ★HUD 박스 1회 캐시 = 라벨 화면 고정
      } else if(isHover && _ripple.playing && hitModel!==_ripple.model){   // 다른 GLB로 옮기면 새 모델로 재시작
        const _bs2=new THREE.Box3().setFromObject(hitModel).getBoundingSphere(_tmpSph);
        _ripple.hit.copy(_bs2.center); _ripple.maxR=_bs2.radius*1.18; _ripple.model=hitModel; _ripple.phase=0; _ripple.depth=Math.abs(camera.position.y);
        _ripple.hudBox=_hud.calc(hitModel);     // ★다른 GLB로 이동 → 박스 재계산
      }
      _ripple.wasHover=isHover;
      if(_ripple.playing){
        if(isHover) _ripple.phase=Math.min(1, _ripple.phase + dt/_RIP_GROW);   // 호버 중: 퍼져 전체 감싼 뒤 그 상태로 정지(멈춤)

      }
      const ph=_ripple.phase;
      _rip.uTime.value=now; _rip.uEnv.value=_ripple.env;
      _rip.uFront.value=Math.min(1, ph/0.85)*_ripple.maxR*1.05;   // 프론트가 중심→전체 훑고 정지(ph=1 유지 시 전체 그물 고정)
      _rip.uHit.value.copy(_ripple.hit);
      if(window.__hudLock){   // 튜너: 대상 오브젝트(__hudTarget) 강제 표시 (라벨·접점 전부 화면 고정 → 회전 안 따라감)
        const tk=window.__hudTarget||'sailing';
        const hm=_rippleTargets.find(t=>t.userData.hud&&t.userData.hud.key===tk);

      // 그물은 현재 펄스가 걸린 GLB(통/대포/타륜)에만 — 다른 GLB(대포 등) 침범 방지
      for(let i=0;i<_rippleSegs.length;i++){ _rippleSegs[i].visible = _ripple.playing && _rippleSegs[i].userData.rippleModel===_ripple.model; }
    }
    // 무거운(관성) 추종: 표시 진행도 p가 목표 tp로 이즈드. dt 보정으로 프레임레이트 무관 일정.
    if(window.__hudLock){ const _t=SECTIONS.find(s=>s.key===(window.__hudTarget||'sailing')); if(_t) sc.tp=_t.snapP; }   // 튜너: 대상 섹션에 스크롤 고정
    const k = 1 - Math.pow(0.12, dt);            // dt당 감쇠(시상수 ~0.5s) — 묵직한 관성 추종
    sc.p += (sc.tp - sc.p) * k;
    if(Math.abs(sc.tp - sc.p) < 0.0005) sc.p = sc.tp;
    const p = sc.p;
    const s = sampleKF(p);
    // 카메라: 시점은 스크롤이 주도(마우스는 타륜 전용). 수면 통과 시 미세 진동(풍덩).
    if(PICK && __ff){   // 위치 잡기 모드 — WASD 자유비행
      const ff=__ff, K=ff.keys, mv=(K.has('shift')?2.8:1)*70*dt, rot=1.4*dt;
      if(K.has('arrowleft')) ff.yaw+=rot; if(K.has('arrowright')) ff.yaw-=rot;
      if(K.has('arrowup')) ff.pitch+=rot; if(K.has('arrowdown')) ff.pitch-=rot;

      ff.fwd.set(cp*Math.sin(ff.yaw), Math.sin(ff.pitch), cp*Math.cos(ff.yaw));
      const right=new THREE.Vector3().crossVectors(ff.fwd,_UP).normalize();
      if(K.has('w')) ff.pos.addScaledVector(ff.fwd, mv);
      if(K.has('s')) ff.pos.addScaledVector(ff.fwd,-mv);
      if(K.has('d')) ff.pos.addScaledVector(right, mv);
      if(K.has('a')) ff.pos.addScaledVector(right,-mv);
      if(K.has('e')) ff.pos.y+=mv; if(K.has('q')) ff.pos.y-=mv;
      camera.position.copy(ff.pos); camera.lookAt(ff.pos.clone().add(ff.fwd));
      if(__pickPanel){ const P=ff.pos, L=P.clone().add(ff.fwd.clone().multiplyScalar(50));
        __pickPanel.textContent='◆ 위치 잡기(WASD)\nWASD=이동  Q/E=아래/위  Shift=빠르게\n방향키=시점 회전\n1히어로 2수면 3항해 4교역 5전투 6탐험 7진영\nC=현재 좌표 복사\n──────────────\n'+
          `섹션 p=${__pickP.toFixed(2)}\npos [${Math.round(P.x)}, ${Math.round(P.y)}, ${Math.round(P.z)}]\nlook[${Math.round(L.x)}, ${Math.round(L.y)}, ${Math.round(L.z)}]`+
          (__pickPanel.dataset.copied?('\n✓ 복사됨:\n'+__pickPanel.dataset.copied):''); }
    }
    else if(window.__camOverride){ const o=window.__camOverride;
      camera.position.set(o.pos[0],o.pos[1],o.pos[2]); camera.lookAt(o.look[0],o.look[1],o.look[2]); }
    else{
    camera.position.set(s.pos[0], s.pos[1], s.pos[2]);
    _look.set(s.look[0], s.look[1], s.look[2]);
    const sdv=Math.abs(camera.position.y);
    if(sdv<6){ camera.position.y += Math.sin(now*0.018)*(1-sdv/6)*0.55; }
    if(!window.__hudLock){ camera.position.x += _mp.x*5.5; camera.position.y += -_mp.y*3.5; }   // ★마우스 시점 패럴랙스(pos만) — 튜너 땐 끔(박스 고정)
    camera.lookAt(_look);
    }
    const sd=Math.abs(camera.position.y);

    // 수면 통과 전환 "베일"(IGLOO 전환.png): 순간이 아니라 넓은 깊이 구간(±16u)에서 천천히 차오르고 빠진다.
    //   부드러운 종(bell) 곡선으로 0→peak→0 — 산/오브젝트가 안개 사이로 흐릿하게 드러났다 사라지는 느낌.

    // ── 섹션 vis(★진행도 기반 종 곡선) + 현재 섹션 = vis 최대. 거리 아님(수직 섹션 Z오프셋 버그 회피). ──
    helmRotY += (tgtY-helmRotY)*0.12; helmRotX += (tgtX-helmRotX)*0.12;   // 우클릭 드래그(관성)
    let curSec=SECTIONS[0], settled=0;
    SECTIONS.forEach(sec=>{
      sec._vis = Math.max(0, Math.min(1, 1 - Math.abs(p - sec.snapP)/0.14));   // snapP ±0.14서 0, 정점서 1
      if(sec._vis>settled){ settled=sec._vis; curSec=sec; }
    });

    // 수중 fog: 섹션 정착 시 멀리(오브젝트+동굴 배경 어렴풋이) / 사이=자욱. ★corridor(교역~)는 시야 트여 동굴 계속 보임.
    if(scene.fog && camera.position.y < -0.5 && !window.__noFog){
      scene.fog.near = 3;
      const corridorReach=Math.max(0, Math.min(1, (p-0.36)/0.12));   // 교역부터 동굴 향해 시야 트임(접근 비트도 동굴 보이게)
      scene.fog.far = 30 + Math.max(settled, corridorReach) * 820;    // 동굴 z-340 원경까지(카메라 최대 거리 ~400) 보이게 far↑
      const dT=Math.max(0,Math.min(1,(p-0.18)/0.78));                 // 항해(p.24)~진영(p1.0) = 깊을수록 짙게
      scene.fog.color.lerpColors(_cShallow,_cDeep,dT);
      scene.background.lerpColors(_cShallow,_cDeep,dT);
    }
    // 깊이 잠수하면 수면 메시(카메라 따라다니는 y=0 plane) 숨김 — 위쪽 하늘색/수면 차단
    if(ctx.water && ctx.water.mesh) ctx.water.mesh.visible = (camera.position.y > -26);

    // ── 섹션 오브젝트: 등장(페이드·진행도) + 조명 + 회전(전 섹션 — 사령관) ──
    //   ★corridor(전투·탐험·진영) 오브젝트는 통(p>0.40)부터 등장해 계속 보임 = 앞쪽 glb들이 원경 랜드마크로(사령관). 항해·교역은 자기 섹션 페이드.
    const cvis=Math.max(0, Math.min(1, (p-0.40)/0.06));
    SECTIONS.forEach(sec=>{
      const grp=sec.group; if(!grp) return;

      grp.visible = ov>0.005;
      grp.traverse(o=>{ if(o.isMesh && o.material){ const ms=Array.isArray(o.material)?o.material:[o.material];

      (sec.objMeshes||[]).forEach(m=>{ if(ov>0.15){ const cur=(sec===curSec);
        m.rotation.set(cur?helmRotX:0, (cur?helmRotY:0) + now*0.0004, 0); } });
    });
    // ── 동굴 lazy load 트리거: 교역(p>0.40) 진입 시 1회만 ──
    if(p > 0.40 && !caveLoadStarted){ caveLoadStarted=true; startCaveLoad(); }
    // ── 동굴 입구 빛 = god rays(방사형 빛줄기) + 약한 코어 블룸. 다가갈수록 강해짐(사령관). 통(원경)=은은, 진영=강. ──
    const prox=Math.max(0, Math.min(1, (p-0.42)/0.58));                  // 통0 → 진영1
    _caveProx=prox;                                                      // 렌더 오버라이드(god rays exposure)서 사용
    if(introCaveGlow) introCaveGlow.visible=false;                       // ★글로우 구 완전 제거(동그라미 원인)
    if(introCaveLight) introCaveLight.intensity=4 + 16*prox;             // ★초록 포인트라이트 강화(입구 안쪽 벽 초록 물들임)
    if(introCaveShaft) introCaveShaft.visible=false;                     // ★빛샘 콘 제거 — god rays가 대신 빛줄기를 만듦
    // ── 동굴 입구 FBX(원경·독립): 교역(p0.40)부터 페이드 인 → 진영까지 계속 보임(사령관: 통부터 저 멀리 계속). ──
    if(introCave){
      const cv=Math.max(0, Math.min(1, (p-0.40)/0.10));
      introCave.visible=cv>0.01;
      (introCave._meshes||[]).forEach(o=>{ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ m.transparent=cv<0.99; m.opacity=cv; }); });

    if(introFloor){

      introFloor.visible=fv>0.01;
      introFloor.material.transparent=fv<0.99; introFloor.material.opacity=fv;
    }
    // ── 동굴 안 터널: 사용 안 함(빨간 동굴이 직접 발광). 항상 숨김. ──
    if(introTunnel) introTunnel.visible=false;
    // ── 나침반(탐험 전용): 통(p>0.40)부터 등장해 계속 보임(원경 랜드마크 — 사령관). 천천히 회전. ──
    if(introCompass){
      const av=cvis;
      introCompass.visible=av>0.01;
      (introCompass._meshes||[]).forEach(o=>{ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>{ const bo=(m.userData&&m.userData.baseOpacity!=null)?m.userData.baseOpacity:1; m.transparent=(av*bo)<0.99; m.opacity=av*bo; }); });
      if(introCompass.userData.light) introCompass.userData.light.intensity=2.6*Math.max(0,Math.min(1,1-Math.abs(p-0.79)/0.13));
      // ★나침반은 항상 자동회전(idle, 원복) + 탐험 섹션이면 우클릭 추가.

    }
    // ── 테이블(진영 전용): 통(p>0.40)부터 등장해 계속 보임 — 빨간 동굴 바로 앞 원경 랜드마크. ──
    if(introTable){

    hero.style.opacity = Math.max(0, 1 - p*7);

    const showCard = camera.position.y < -22 && settled > 0.35;     // 수중 + 섹션 정착(진행도 기반)

    card.style.opacity = showCard ? '1' : '0';

  // ── 동굴 빨간빛 "선택적 블룸"(샘플 voyage/동굴모습.png 매칭): ★동굴/글로우만 번지고 테이블·바다·배는 안 번짐 ──
  //   표준 2-composer 기법: ①bloomComposer=블룸 대상(레이어1)만 밝게 렌더(나머지 검정)→블룸. ②finalComposer=실제 씬 + 블룸텍스처 가산.
  const BLOOM_LAYER=1; const bloomLayer=new THREE.Layers(); bloomLayer.set(BLOOM_LAYER);

  let _darkList=null;
  function _buildDarkList(){ _darkList=[]; scene.traverse(o=>{ if(o.isMesh && !bloomLayer.test(o.layers)) _darkList.push(o); }); }
  const _sz=new THREE.Vector2(innerWidth, innerHeight);
  const _caveScreen=new THREE.Vector3();
  const bloomComposer=new EffectComposer(ctx.renderer); bloomComposer.renderToScreen=false;
  bloomComposer.addPass(new RenderPass(scene, camera));
  // ── 입구 안쪽 빨간 발광 = 부드러운 블룸(떨림 없음·안정적). god rays(방사 블러)는 화면 shimmer 때문에 제거(사령관). ──
  const bloom=new UnrealBloomPass(_sz, 0.8, 0.85, 0.0);  // strength/radius/threshold. 입구 모양으로 은은하게 번짐.

  finalComposer.addPass(new RenderPass(scene, camera));
  const mixPass=new ShaderPass(new THREE.ShaderMaterial({
    uniforms:{ baseTexture:{value:null}, bloomTexture:{value:bloomComposer.renderTarget2.texture} },
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'uniform sampler2D baseTexture;uniform sampler2D bloomTexture;varying vec2 vUv;'+

  }), 'baseTexture'); mixPass.needsSwap=true;

  // ★블룸 컴포저는 저해상도(흐릿한 블룸이라 무손실, 비용↓), 최종 컴포저는 풀해상도.
  const _setPR=(c, pr)=>{ c.setSize(innerWidth,innerHeight); c.setPixelRatio(pr); };

  // ★코리도 동적 해상도(A): 블룸 켜진 무거운 구간(교역~동굴)만 출력 픽셀레이트↓ → 그 구간 fps 회복.
  //   인트로(블룸 off)는 _PRfinal 그대로 = 화질 유지. ?hq=1 = 비활성(코리도도 풀해상도, 원본 비교용).
  const CORRIDOR_PR = params.has('hq') ? null : Math.min(1.0, devicePixelRatio);
  let _corLow=false;

  ctx.setRenderOverride(()=>{
    // ── 코리도 진입/이탈 시 출력 해상도 1회 전환(hysteresis — 매 프레임 RT 재할당 방지) ──
    if(CORRIDOR_PR!=null){ const want=_caveProx>0.015;

    // ★동굴 보일 때만 블룸 17패스 실행. 안 보이면(히어로/항해) 단일 합성 → 상시 렉 제거(사령관).
    if(_caveProx > 0.015){

  });

  {
    const _total=Math.max(1, PRELOAD.length);

    const _bump=()=>{ _done++; LS.setProgress(_done/_total); LS.setStage('바다를 불러오는 중… '+Math.round(_done/_total*100)+'%'); };

    await Promise.all(PRELOAD.map(p=>p.catch(()=>{})));
    // ── ★prewarm(코리도 진입 hitch 제거): 로더가 캔버스를 덮은 동안 코리도 오브젝트를 강제로 켜고
    //    블룸 경로까지 1프레임 강제 렌더 → ①전 머티리얼 셰이더 컴파일 ②동굴/대포/나침반/테이블 정점버퍼 GPU 업로드

    try{
      const _warmObjs=[introCave, introCompass, introTable, introTunnel, introFloor, ...SECTIONS.map(s=>s.group)].filter(Boolean);

      const _proxBak=_caveProx; _caveProx=1;                                    // 블룸 경로 강제 가동
      const _ro=ctx.getRenderOverride(); if(_ro) _ro(); else ctx.renderer.render(scene,camera);   // bloomComposer+finalComposer 1프레임

      _wm.forEach((m,i)=>{ m.frustumCulled=_fcBak[i]; const a=Array.isArray(m.material)?m.material:[m.material]; a.forEach(mm=>{ if(mm){ mm.transparent=false; mm.opacity=1; } }); });

    LS.done();   // 등불 만점화 후 페이드아웃
    L.style.transition='opacity .5s'; L.style.opacity='0'; setTimeout(()=>{ LS.hide(); }, 520);
  }

  // ── [1] GAME START → 캐릭터·추종자 선택(select.html) → 튜토리얼 ──
  { const bs=document.getElementById('btnStart');
    if(bs) bs.addEventListener('click', ()=>{ (window.top||window).location.href='/select.html'; }); }  // ★_journey iframe 안에서도 최상위 창을 이동 → 선택(클래스→추종자→진영) 전체화면 진입
  // ★게임식 메뉴 선택 커서(호버 아님): 항상 하나 활성 · 위/아래 키 이동 · 마우스 올리면 선택 · 엔터 실행
  { const _mb=[...document.querySelectorAll('.menu .mbtn')]; let _msel=0;

  if(new URLSearchParams(location.search).has('fader')){

      '대포':()=>({pos:battleSec.group, rot:(battleSec.objMeshes||[])[0], scl:(battleSec.objMeshes||[])[0]}),

      '테이블':()=>({pos:introTable, rot:introTable&&introTable.userData.tableObj, scl:introTable&&introTable.userData.tableObj}),

    const ST={}; for(const k in OBJS){ const o=OBJS[k](); if(!o.pos){ST[k]={px:0,py:0,pz:0,rx:0,ry:0,rz:0,base:1,mul:1};continue;} const p=o.pos.position,r=o.rot.rotation,s=o.scl.scale.x; ST[k]={px:p.x,py:p.y,pz:p.z,rx:r.x,ry:r.y,rz:r.z,base:s||1,mul:1}; }

    const OBJROWS=[['px','x',-150,150,0.5],['py','y',-200,-40,0.5],['pz','z',-700,60,1],['rx','rotX',-3.15,3.15,0.01],['ry','rotY',-3.15,3.15,0.01],['rz','rotZ',-3.15,3.15,0.01],['mul','scale',0.1,4,0.02]];
