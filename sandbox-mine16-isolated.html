<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOMOB Mine16 Isolated QA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d0c;color:#ddd;font:12px system-ui}#hud{position:fixed;left:16px;top:14px;z-index:10}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","three-mesh-bvh":"https://esm.sh/three-mesh-bvh@0.7.0?external=three"}}</script></head><body><div id="hud">Mine16 isolated · WASD / Shift / Space</div>
<script type="module">
import * as THREE from 'three';
import {initCore} from './modules/core.js';
import {initPhysics} from './modules/physics.js';
import {initInput} from './modules/input.js';
import {initPlayer,KAY_CHARS} from './modules/player.js';
import {initMineInterior16} from './modules/windgate16-interior-runtime.js?v=16c';
window.__errors=[];addEventListener('error',e=>__errors.push(e.message));addEventListener('unhandledrejection',e=>__errors.push(String(e.reason)));
try{
 const ctx=initCore();window.ctx=ctx;ctx.scene.background=new THREE.Color('#0b0d0c');ctx.scene.fog=new THREE.Fog('#0b0d0c',8,48);await initPhysics(ctx);initInput(ctx);
 const root=new THREE.Group();ctx.scene.add(root);
 const fake={root,collide:[],field:{points:[{id:'cave',x:-97,z:-34,y:33}]},groundAt:()=>0,dispose(){root.removeFromParent();},qualityVersion:'mine16-isolated'};
 ctx.terrain=fake;const zone=await initMineInterior16(ctx,fake);const s=zone.interiorSpawn;initPlayer(ctx,{spawn:{x:s.x,y:27.45,z:s.z},charUrl:KAY_CHARS.knight});ctx.player.setThird(true);ctx.player.setYaw(Math.PI);ctx.onUpdate(()=>ctx.stepPhysics());ctx.start();await zone.enterMine({instant:true});
 for(let i=0;i<100&&!window.__curAnim;i++)await new Promise(r=>setTimeout(r,80));
 document.body.dataset.ready='true';window.__mine16={ctx,zone,fake,report:()=>({ready:true,zone:zone.current,pos:{...ctx.player.pos},errors:__errors,oreNodes:zone.oreNodes.length,cameraCorrections:zone.cameraCorrections})};
}catch(e){window.__errors.push(e.stack||e.message);document.body.dataset.fail='true';document.getElementById('hud').textContent='FAIL '+e.message;}
</script></body></html>
