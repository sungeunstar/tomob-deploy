<script>window.__auroraErrors=[];const originalError=console.error.bind(console);console.error=(...a)=>{const s=a.map(String).join(' ');if(!window.__auroraErrors.includes(s)&&window.__auroraErrors.length<30)window.__auroraErrors.push(s);originalError(...a);};addEventListener('error',e=>window.__auroraErrors.push(e.message));addEventListener('unhandledrejection',e=>window.__auroraErrors.push(String(e.reason)));</script>

<script type="module">
import * as THREE from 'three';
import {initCore} from './modules/core.js';
import {initPhysics} from './modules/physics.js';
import {initWater} from './modules/water.js';
import {initInput} from './modules/input.js';
import {initPlayer,KAY_CHARS} from './modules/player.js';
import {initAuroraArtpass} from './modules/aurora-artpass.js?v=5b';
const $=s=>document.getElementById(s),q=new URLSearchParams(location.search),overview=q.get('view')==='overview',delay=ms=>new Promise(r=>setTimeout(r,ms));
try{
 const ctx=initCore();window.ctx=ctx;ctx.renderer.outputColorSpace=THREE.SRGBColorSpace;ctx.renderer.toneMapping=THREE.ACESFilmicToneMapping;ctx.renderer.toneMappingExposure=1.02;
 ctx.scene.background=new THREE.Color('#aac8c9');ctx.scene.fog=new THREE.FogExp2('#aac8c9',.00135);ctx.hemi.color.set('#e7f0e3');ctx.hemi.groundColor.set('#637d68');ctx.hemi.intensity=1.45;ctx.sun.color.set('#ffebcf');ctx.sun.intensity=2.6;ctx.sun.position.set(-100,175,105);ctx.sun.shadow.normalBias=.10;ctx.sun.shadow.bias=-.0001;Object.assign(ctx.sun.shadow.camera,{left:-145,right:145,top:145,bottom:-145,near:1,far:450});ctx.sun.shadow.camera.updateProjectionMatrix();ctx.fill.intensity=.48;ctx.fill.color.set('#b8d1d4');ctx.amb.intensity=.16;
 await initPhysics(ctx);initWater(ctx);initInput(ctx);const island=await initAuroraArtpass(ctx);const character=KAY_CHARS[q.get('char')]||KAY_CHARS.knight;initPlayer(ctx,{spawn:island.spawn,charUrl:character});ctx.player.setThird(true);ctx.stepPhysics();
 let frames=0,fps=0,count=0,last=performance.now(),ready=false,inspection=null;
 const views={falls:{eye:[-29,21,11],at:[-45,17,-23]},shrine:{eye:[7,57,-20],at:[-9,50,-41]},workshop:{eye:[70,14,48],at:[88,13,31]},harbor:{eye:[-39,18,77],at:[-66,15,62]},cave:{eye:[46,18,34],at:[69,17,11]},dock:{eye:[-21,17,122],at:[-48,5,104]},mill:{eye:[-50,21,35],at:[-77,19,20]}};
 function go(id){const p=island.field.points.find(p=>p.id===id);if(!p)return;inspection=p;$('location').textContent=p.name;$('places').value=p.id;if(!overview)ctx.player.setSpawn(p.x,island.groundAt(p.x,p.z,p.y+2)+2.3,p.z);}
 function selectOptions(){for(const p of island.field.points){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('places').appendChild(o);}}
 $('places').onchange=()=>go($('places').value);$('reset').onclick=()=>{ctx.player.setSpawn(island.spawn.x,island.spawn.y,island.spawn.z);inspection=null;$('location').textContent='해안 산책로';};
 const next=new URL(location.href);overview?next.searchParams.delete('view'):next.searchParams.set('view','overview');$('overview').href=next.href;$('overview').textContent=overview?'본편 조작으로 탐험':'섬 전체 보기';
 function aim(){if(!overview)return;ctx.camera.fov=43;ctx.camera.updateProjectionMatrix();if(inspection){const p=inspection,v=views[p.id]||{eye:[p.x+27,p.y+21,p.z+32],at:[p.x,p.y+3,p.z]};ctx.camera.position.set(...v.eye);ctx.camera.lookAt(...v.at);}else{ctx.camera.position.set(188,158,221);ctx.camera.lookAt(0,17,0);}}
 if(overview){$('cross').style.display='none';$('hint').textContent='장소를 선택하면 가까이 볼 수 있어요.';ctx.onUpdate(aim);}
 ctx.onUpdate(()=>ctx.stepPhysics());
 const report=()=>{const p=ctx.player.pos;return{build:island.qualityVersion,ready,controller:'modules/player.js (unchanged)',characterReady:typeof window.__curAnim==='function',animation:window.__curAnim?.()||null,position:{x:+p.x.toFixed(3),y:+p.y.toFixed(3),z:+p.z.toFixed(3)},ground:+island.groundAt(p.x,p.z,p.y+.2).toFixed(3),assets:island.assets,details:island.detailStats,basins:island.basinQA,bvh:!!island.bvh,drawCalls:ctx.renderer.info.render.calls,triangles:ctx.renderer.info.render.triangles,wallClockFPS:fps,frames,errors:window.__auroraErrors.slice(-8),nativeTest:window.__auroraQA?.testResult||null};};
 ctx.onUpdate(()=>{frames++;count++;const now=performance.now();if(now-last>=800){fps=+(count*1000/(now-last)).toFixed(1);count=0;last=now;const p=ctx.player.pos;$('pos').textContent=`${p.x.toFixed(0)}, ${p.z.toFixed(0)} · ${p.y.toFixed(1)}m`;$('fps').textContent=`${fps} FPS`;if(q.has('qa')){$('qa').style.display='block';$('qa').textContent=JSON.stringify(report(),null,2);}}});
 async function nativeTest(){if(overview||!ready)return;$('native-test').disabled=true;const samples=[],emit=(type,code)=>window.dispatchEvent(new KeyboardEvent(type,{code,bubbles:true}));const old=ctx.getRenderOverride();try{await ctx.renderer.domElement.requestPointerLock();if(document.pointerLockElement!==ctx.renderer.domElement)throw new Error('Pointer lock not granted');ctx.setRenderOverride(()=>{});const advance=n=>{for(let i=0;i<n;i++)ctx.tick(1/60);},sample=tag=>{const r=report();samples.push({tag,position:r.position,animation:r.animation});};advance(30);sample('idle');emit('keydown','KeyW');advance(30);sample('walk');emit('keydown','ShiftLeft');advance(30);sample('run');emit('keyup','ShiftLeft');emit('keyup','KeyW');advance(45);sample('settled');const y=ctx.player.pos.y;let peak=y;const clips=new Set();emit('keydown','Space');for(let i=0;i<80;i++){ctx.tick(1/60);peak=Math.max(peak,ctx.player.pos.y);clips.add(window.__curAnim?.());}emit('keyup','Space');sample('land');const moved=Math.hypot(samples[1].position.x-samples[0].position.x,samples[1].position.z-samples[0].position.z),jumpDelta=peak-y;window.__auroraQA.testResult={method:'native input and fixed-step physics; rendering temporarily suppressed',moved,jumpDelta,clips:[...clips],samples,pass:moved>.2&&jumpDelta>.15&&[...clips].some(c=>/Jump/.test(c||''))};}catch(e){window.__auroraQA.testResult={pass:false,reason:e.message,samples};}finally{for(const c of['KeyW','ShiftLeft','Space'])emit('keyup',c);ctx.setRenderOverride(old);document.exitPointerLock?.();$('native-test').disabled=false;ctx.renderer.render(ctx.scene,ctx.camera);$('qa').textContent=JSON.stringify(report(),null,2);}}
 function capture(){aim();ctx.renderer.render(ctx.scene,ctx.camera);const c=document.createElement('canvas');c.width=384;c.height=Math.round(384*innerHeight/innerWidth);c.getContext('2d').drawImage(ctx.renderer.domElement,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.52);$('capture-image').src=data;$('capture-data').textContent=data;$('capture').style.display='block';return data;}
 window.__auroraQA={ctx,island,report,go,nativeTest,capture,aim,testResult:null};if(q.has('qa')){document.querySelectorAll('.qa-only').forEach(x=>x.style.display='block');$('native-test').onclick=nativeTest;$('snapshot').onclick=capture;}
 ctx.start();await island.ready;for(let i=0;i<100&&!window.__curAnim;i++)await delay(250);ready=true;selectOptions();if(q.get('place'))go(q.get('place'));document.body.dataset.ready='true';$('load').remove();if(island.assets.errors.length)$('notice').textContent='일부 에셋 로드 실패 — 진단 화면을 확인해주세요.';console.info('[aurora-v5]',report());
}catch(e){console.error('[aurora-v5 boot]',e);$('load-note').textContent='초기화 실패: '+e.message;$('load').querySelector('progress')?.remove();}
</script></body></html>
