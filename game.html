import { initFortify } from '/tomob-deploy/modules/fortify.js';   // 🧱 블록 방어 축성(L키 — 성벽·타워, static 인스턴싱+HP파괴)

import { initCannon }  from '/tomob-deploy/modules/cannon.js';
import { initCannonFx } from '/tomob-deploy/modules/cannonfx.js';   // ⚓ 대포 "제대로" VFX(머즐/착탄 먼지·파편·판자·잔불·연기+킥)
import { initMonsters } from '/tomob-deploy/modules/monsters.js';
import { initTribes }  from '/tomob-deploy/modules/tribes.js';    // 🏴 12부족·2진영 데이터(SSOT) — raiders/claim 앞

import { initHitfx }   from '/tomob-deploy/modules/hitfx.js';   // 💥 타격 임팩트(흰 휘도 플래시+스파크 버스트) — combat 단일통로에서 ctx.flashHit 호출

import { initSiegeFort } from '/tomob-deploy/modules/siegefort.js';   // 🏰 첫 섬 요새 공성전(Hexagon 성+투석기탑, 함포 직격/스플래시/연쇄)
import { initCapture } from '/tomob-deploy/modules/capture.js';   // 🏴 깃발 점령 게이지(방어타워 무력화→상륙→점령, 공/수 대칭) — claim·raiders 뒤
import { initRaidship } from '/tomob-deploy/modules/raidship.js'; // 🚢 습격선 접근 연출(해적 갤리온이 해안으로) — raid 앞
import { initRaid }    from '/tomob-deploy/modules/raid.js';      // ⚔️ 습격 이벤트(점령 섬 위협) — capture·raiders·claim 뒤
import { initGarrison } from '/tomob-deploy/modules/garrison.js'; // 🛡️ 그롬 주둔(점령 섬 수비대, 습격병 자동방어)
import { initTrade }   from '/tomob-deploy/modules/trade.js';
import { initCombat }  from '/tomob-deploy/modules/combat.js';
import { initCombatTuto } from '/tomob-deploy/modules/combattuto.js';   // ⚔️ 전투 튜토(첫 전투 발동, 최초 1회)
import { initTemperature } from '/tomob-deploy/modules/temperature.js';
import { initMagic }   from '/tomob-deploy/modules/magic.js';
import { initGrade }   from '/tomob-deploy/modules/grade.js';   // 🎨 컬러 그레이딩 포스트 패스(화면 전체 색감) — magic 블룸 override를 감쌈. 반드시 magic 뒤.
import { initReputation } from '/tomob-deploy/modules/reputation.js';
import { initFaction }  from '/tomob-deploy/modules/faction.js';   // ⚑ 축5 세력 선언(ctx.faction) — reputation·crew·claimed 뒤(5조건 참조)
import { initNpc }     from '/tomob-deploy/modules/npc.js';
import { initTrader }  from '/tomob-deploy/modules/trader.js';
import { initSeaevents } from '/tomob-deploy/modules/seaevents.js';   // 🌊 해적 랜덤 조우(중심가중) + 상선 약탈([E])
import { initContract }  from '/tomob-deploy/modules/contract.js';    // 📜 항구 배송 계약(데스 스트랜딩식 위험 해역 보상)
import { initInventory } from '/tomob-deploy/modules/inventory.js';
import { initPickup }   from '/tomob-deploy/modules/pickup.js';   // 공용 드롭+마그넷 픽업(벌목·채광·전리품)
import { initInvui }   from '/tomob-deploy/modules/invui.js';
import { initForge }   from '/tomob-deploy/modules/forge.js';
import { initHarbor }  from '/tomob-deploy/modules/harbor.js';
import { initWharf }   from '/tomob-deploy/modules/wharf.js';
import { initSave }    from '/tomob-deploy/modules/save.js';   // 💾 로컬 세이브(스냅샷/복원) — ?load=1 시 오프닝 스킵하고 저장 지점 재개
import { restoreAndStartAutosave } from '/tomob-deploy/modules/save-boot.js';
import { initNetcode } from '/tomob-deploy/modules/netcode.js';   // 🌐 멀티 위치 릴레이 클라 — 타 플레이어 고스트 + 서버 시간 동기(Phase 3)
import { initMenu }    from '/tomob-deploy/modules/menu.js';   // ⎋ 인게임 메뉴(ESC) — 계속/근처섬복귀/캐릭터선택
import { initTutoSlot } from '/tomob-deploy/modules/tutoslot.js';   // 🎯 중앙 튜토 팝업 단일 슬롯(gather/combat/raid 동시노출 방지)
import { initGatherTuto } from '/tomob-deploy/modules/gathertuto.js';   // 🪓⛏️ 채집 튜토(벌목·채광) — 전투튜토 패턴
import { initRaidTuto } from '/tomob-deploy/modules/raidtuto.js';   // 🛡️ 방어 튜토(첫 습격 시 자동, ctx.raid.status 폴링) — raid 뒤
import { initQuestline } from '/tomob-deploy/modules/questline.js';   // 🧭 1차 퀘스트라인(?quest=1) — 깨어남→채집→제작→항구→배
import { initWorldstream } from '/tomob-deploy/modules/worldstream.js';   // 🌊 오픈월드 섬 스트리밍(?stream=1) — 근처 섬만 3D 로딩·페이드
import { initOpening } from '/tomob-deploy/modules/opening.js';   // ⚓ P4-B: 오프닝 골든패스(?opening=1) — 오세베르그 없이 caravel 전투→난파→표류→깨어남→그 자리서 게임 시작
import { initShipyard } from '/tomob-deploy/modules/shipyard.js';   // 🔨 조선소(K) — 부두 옆 바다에 배 건조(목재+골드 차감). 퀘스트라인 Q5(ctx.onShipBuilt) 완료 훅.
import { initGate }    from '/tomob-deploy/modules/gate.js';   // 🌙 차원문 게이트 — 자정(sky dayTime 0.75) 근처 섬 개방·등급별 몹 웨이브+보스 토벌
import { initDungeonRun } from '/tomob-deploy/modules/dungeonrun.js';   // ⛏️ 광산 던전 — empire 광산 패널 "던전 입장"(ctx.dungeon.enter)
import { initPerfProbe } from '/tomob-deploy/modules/perfprobe.js';   // 📊 프레임 드랍 계측 — 콘솔 __perf() (헤드리스로는 전투 재현이 안 돼 실기기 측정용)
import { initNavalTuto } from '/tomob-deploy/modules/navaltuto.js';   // ⚓ 해전/항해 튜토(첫 배 탑승 시 Shift→Q→E 안내, 최초 1회)
import { initQuestFx } from '/tomob-deploy/modules/questfx.js';   // 🗼 퀘스트 시각효과 — 동료 머리 위 ! 빌보드 + 첫 목표 하늘 빛기둥
import { initLoadScreen } from '/tomob-deploy/modules/loadscreen.js';   // 🏮 공용 로딩 화면(석판 배경+tomob 로고+세계관 문구+등불 진행률)

// 🏮 로딩 화면. expect = stage 갱신 횟수 = 진행률 분모.
//    기본 14 + 스트리밍 1 + 오프닝 4(opening.js가 setLoad를 4번 부른다) + 세이브 복원 1.
const _q0 = new URLSearchParams(location.search);
const LS = initLoadScreen({ expect: 14 + (_q0.get('stream')==='1'?1:0)
                                     + (_q0.get('opening')==='1'?4:0)
                                     + (_q0.get('load')==='1'?1:0) });
//   ★L을 stage 엘리먼트로 잡는다 → 아래 `L.textContent='…'` 17곳이 그대로 살아 있고, 대입할 때마다 등불이 차오른다.
const L = LS.stage;
try{
  // 세션 정리: ?keepOnly=세션명 → 그 세션만 남기고 나머지 삭제
  const _ko=new URLSearchParams(location.search).get('keepOnly');
  if(_ko){ try{ const ss=JSON.parse(localStorage.getItem('voyageSessions')||'{}'); const k={}; if(ss[_ko]){ k[_ko]=ss[_ko]; localStorage.setItem('voyageMapV2',JSON.stringify(ss[_ko])); } localStorage.setItem('voyageSessions',JSON.stringify(k)); }catch(e){} }
  const ctx = initCore();
  // ★2026-07-10(사령관 "전투도 잠깐 키고" — 튜토리얼 재점검엔 진짜 해상전투가 필요) — 전투 기본 ON으로 복구.
  //    임시로 다시 끄고 싶으면 ?combat=0. 중앙 튜토 팝업(tutoslot) 토글은 그대로 유지(?tuto=1).
  { const _tq = new URLSearchParams(location.search);
    window.__noNaval = _tq.get('combat') === '0';   // 적선 조우·상선약탈(seaevents) + 오프닝 전투(opening) — 기본 ON
    window.__noTuto  = _tq.get('tuto')   !== '1';   // 중앙 튜토 팝업(tutoslot: gather/combat/raid) 차단
    if(window.__noNaval) console.log('[test] ⚔️ 전투/적선 OFF (?combat=0 지정됨)');
    if(window.__noTuto)  console.log('[test] 🎯 튜토리얼 OFF (복구: ?tuto=1)');
  }
  initInput(ctx);      // ⌨️ 입력 모드 라우터 최선두 등록 — 이후 모듈 핸들러가 ctx.input.blocks()로 게이트(lazy 참조라 순서 무관)
  initAI(ctx);         // 🧠 AI 코어(ctx.ai) — monsters/seaevents가 소비. lazy 참조라 최선두 등록만 하면 됨
  initIslands(ctx);    // 🏝️ R5-P1 아일랜드 레지스트리 — terrain/worldstream보다 먼저(등록 받을 준비)
  initSave(ctx);       // 💾 세이브 모듈 등록(ctx.save) — 복원/자동저장은 초기화 말미
  initTutoSlot(ctx);   // 🎯 중앙 튜토 팝업 단일 슬롯 — 팝업들이 show 전에 참조하므로 최선두 등록
  const _load = new URLSearchParams(location.search).get('load')==='1';   // 💾 이어하기(오프닝/정착 스킵, 저장 지점 복원)
  L.textContent='물리엔진(Rapier) 로드 중…';   await initPhysics(ctx);
  L.textContent='바다 생성 중…';               initWater(ctx);
  initFoamtrail(ctx);   // 🌊 웨이크/물보라 포말 RT — water 직후(setWake 주입), renderer 필요(core 이후)
  initSeabed(ctx);   // 🏝️ 해저 바닥 — 수면 아래 잠수 시 모래 바닥이 보이게(먼 곳은 수중 안개로 페이드=깊이감)
  L.textContent='하늘 생성 중…';               initSky(ctx);

  //   initCrew(ctx)가 이미 "진짜" 추종자(ctx.crew 피규어)를 로딩해두므로 그 둘이 각자 따로 존재해 캐릭터가 2명으로 보였음
  //   (opening.js 경로는 이미 이렇게 고쳐져 있었으나, 비오프닝 경로는 누락됨). crew 피규어를 그대로 재사용해 하나로 통합.
  if(!_opening && !ctx.follower){ (async()=>{ try{
    let figGroup=null, figMixer=null;
    if(ctx.crew && ctx.crew.figureGroup){
      for(let i=0; i<30 && !figGroup; i++){ figGroup=ctx.crew.figureGroup(); if(!figGroup) await new Promise(r=>setTimeout(r,100)); }
      figMixer = ctx.crew.figureMixer ? ctx.crew.figureMixer() : null;
    }
    if(figGroup){
      console.log('[game] 비오프닝 추종자 = crew 피규어 재사용');
    } else {
      console.warn('[game] crew 피규어 로드 실패 — 추종자(ctx.follower) 없이 진행');
    }
  }catch(e){ console.warn('[game] 추종자 연결 실패',e&&e.message); } })(); }
  if(new URLSearchParams(location.search).get('stream')==='1'){ L.textContent='월드 스트리밍 준비 중…'; await initWorldstream(ctx); }   // 🌊 오픈월드 섬 스트리밍(PoC) — 근처 섬만 3D 로딩

  // ⚓ P4-B: 오프닝 골든패스 — 오세베르그 없이 이 페이지에서 caravel 전투→난파→표류→깨어남 재생.
  //   깨어남 대사 뒤 '클릭하여 일어나기' 클릭 = 그 자리(카브 해안)에서 1인칭 복귀 + 퀘스트라인 시작(페이지 이동 없음).
  if(_opening){
    await initOpening(ctx, { mode:'game', setLoad:t=>{ L.textContent=t; },
      onComplete:()=>{
        // 💾 깨어남 = 실제 게임 시작 → 자동저장 활성화 + 첫 저장(cid 확정) + URL을 이어하기(?load=1&cid) 형태로 교체.
        //    F5 새로고침해도 오프닝을 처음부터 재생하지 않고 저장 지점에서 재개. 오프닝 중엔 저장 안 함(먼바다 위치 저장 방지).
        //    ★버그③(2026-07-13): questline LS_KEY가 cid 기준이 되도록 — 오프닝 URL엔 cid가 없어 save.write()로
        //    먼저 cid를 확정한 뒤 그 cid를 initQuestline에 주입한다(cid 없으면 이름으로 폴백 → 동명이인 재캐릭터 완료
        //    스킵 버그). 두 번째 write()는 방금 시작된 퀘스트 1단계(intro)까지 반영해 재저장(첫 저장에 quest=null로
        //    남지 않게).
        let s = null;
        try{ ctx.save && ctx.save.markLive && ctx.save.markLive();
          s = ctx.save && ctx.save.write && ctx.save.write(); }catch(_){}
        try{ initQuestline(ctx, { cid: s && s.cid }); }catch(e){ console.warn('[game] questline 시작 실패', e&&e.message); }
        try{ const s2=ctx.save && ctx.save.write && ctx.save.write(); const cid=(s2&&s2.cid)||(s&&s.cid);
          if(cid){ const u=new URL(location.href); u.searchParams.delete('opening'); u.searchParams.set('load','1'); u.searchParams.set('cid', cid); history.replaceState(null,'',u.toString()); } }catch(_){}
      } });
  }

  // 💾 이어하기: 저장 지점 복원(위치·레벨·인벤·평판·영토·함대·퀘스트). 오프닝/정착 없이 그 지점부터.
  if(_load) L.textContent='세이브 불러오는 중…';
  const _saveBoot=await restoreAndStartAutosave(ctx.save,_load);
  if(_saveBoot?.redirecting){ const e=new Error('직업 정본 URL로 재시작'); e.redirecting=true; throw e; }
  if(_saveBoot?.ok===false){ location.replace('select.html'); const e=new Error('세이브 없음 — 캐릭터 선택으로 이동'); e.redirecting=true; throw e; }
  initMenu(ctx);   // ⎋ 인게임 메뉴(ESC) — 계속/근처섬복귀/캐릭터선택

  // ⚔️ 해적선 전투(navalcombat/destruct/shipwreck) = 골든패스 [3] 단계 전용 → 본체 부팅 시 로드 안 함.
  //   적 해적선이 시작부터 떠 있는 건 게임 흐름과 무관 → 제거. 격리 하네스 _navalcombat.html서 검증 유지.
  //   ※ [3] 조우 시점에 동적 로드(import('/tomob-deploy/modules/navalcombat.js'))로 켜는 게 맞음 (흐름 기반 로딩, 후속).

  // 물리 스텝은 항상 마지막(캐릭터 이동 계산 뒤)
  ctx.onUpdate(()=> ctx.stepPhysics());
  // HUD 좌표 + 시간
  const _timeLbl=t=>{ const h=((t*24)+6)%24; const hh=String(Math.floor(h)).padStart(2,'0'); const mm=String(Math.floor((h%1)*60)).padStart(2,'0'); return `${hh}:${mm}`; };   // dayTime 0=일출(06시) 기준 대략 표기
  ctx.onUpdate(()=>{ const p=ctx.player.pos; document.getElementById('pos').textContent=`위치 (${p.x.toFixed(0)}, ${p.z.toFixed(0)}) · 높이 ${p.y.toFixed(0)}m`;
    if(ctx.sky&&ctx.sky.getTime){ const th=document.getElementById('timeHud'); if(th) th.textContent=`· ${_timeLbl(ctx.sky.getTime())} (t=${ctx.sky.getTime().toFixed(2)}${ctx.sky.timeScale>1?' ×'+ctx.sky.timeScale:''})`; } });
  // 시간 디버그 키: [ ] 시간 ∓0.02, \ 빠른배속 토글, N 밤낮 — ⚙️ 샌드박스/테스트(__testMode)에서만. 일반 게임은 [ ]=스펠사이클(magic.js).
  addEventListener('keydown',e=>{ if(!window.__testMode) return; if(!ctx.sky||!ctx.sky.setTime) return;
    if(e.code==='BracketLeft')  ctx.sky.setTime(ctx.sky.getTime()-0.02);
    else if(e.code==='BracketRight') ctx.sky.setTime(ctx.sky.getTime()+0.02);
    else if(e.code==='Backslash') ctx.sky.timeScale = (ctx.sky.timeScale>1?1:60);
    else if(e.code==='KeyN'){ const t=ctx.sky.getTime(); const isNight = (t>0.5&&t<1.0);
      // ★ N = 낮↔밤 부드러운 전환(석양/여명을 거쳐 ~14초, 아주 서서히). 즉시 점프(setTime) 폐지.
      //   밤=0.75(자정). tween은 sky.js가 항상 시간 전진(일몰/일출 경유)으로 보간 → 밤→낮은 동이 트며 밝아진다.
      if(ctx.sky.tweenTime) ctx.sky.tweenTime(isNight?0.25:0.75, 14.0);
      else ctx.sky.setTime(isNight?0.25:0.72); } });   // N = 낮↔밤 전환(석양 경유)

  // 🎵 P = "I am MAS" 배경음악 토글 (재생↔정지). 파일은 mas 루트 → game.html(/)과 무관하게 절대경로 사용.
  { let masBgm=null;
    addEventListener('keydown',e=>{ if(e.code!=='KeyP') return; if(!window.__testMode) return;   // ⚙️ 음악 토글=샌드박스/테스트 전용(일반 게임은 P=이모트)
      if(!masBgm){ masBgm=new Audio('/i%20am%20mas.mp3'); masBgm.loop=true; masBgm.volume=0.5; }
      if(masBgm.paused){ masBgm.play().catch(err=>console.error('[bgm]',err)); }
      else { masBgm.pause(); } }); }

  // 🐉 Shift+K = 드래곤 보스 소환(테스트용) — ★K는 조선소(건조)로 이관됨 → 드래곤 테스트는 Shift+K로 분리(충돌 방지)
  addEventListener('keydown',e=>{ if(e.code!=='KeyK'||!e.shiftKey||!ctx.spawnMonster) return; if(!window.__testMode) return;   // ⚙️ 드래곤 소환=샌드박스/테스트 전용
    const p=ctx.player.pos, g=ctx.terrain.groundAt.bind(ctx.terrain);
    ctx.terrain.groundAt=(x,z,d)=>{ const v=g(x,z,d); return v>0.8?v:(p.y||6.8); };   // 배 위 등 바닥 못찾는 위치 보정
    ctx.spawnMonster({k:'dragon', at:{x:p.x+60, z:p.z+60}, ignoreMax:true});
    setTimeout(()=>{ ctx.terrain.groundAt=g; }, 3000);
    console.log('드래곤 보스 소환 — 하늘에서 선회 등장'); });

  // ⚙️ 디버그 HUD(비·시간배속·밤낮·음악·드래곤)는 샌드박스/테스트(__testMode)에서만 표시. Ctrl+Shift+K 토글 후 동기화.
  const _syncDbgHud=()=>{ const dh=document.getElementById('dbgHud'); if(dh) dh.style.display = window.__testMode ? '' : 'none'; };
  _syncDbgHud();
  addEventListener('keydown',e=>{ if(e.code==='KeyK'&&e.ctrlKey&&e.shiftKey) setTimeout(_syncDbgHud,0); });

  // ⏱ FPS 카운터 (0.5초 평균) — 사령관 실화면 성능 확인용. 밤하늘 볼류 패스 부하 모니터.
  { const fpsEl=document.getElementById('fps'); let acc=0,cnt=0,lt=performance.now();
    ctx.onUpdate((dt)=>{ acc+=dt; cnt++; const now=performance.now();
      if(now-lt>=500){ const f=cnt/acc; const n=(ctx.nightsky?ctx.nightsky.night:0);
        fpsEl.textContent=`FPS ${f.toFixed(0)}  ${n>0.01?'밤하늘 ON('+(n).toFixed(2)+')':'주간'}`;
        acc=0;cnt=0;lt=now; } }); }

  // ⚡ 히트fx 셰이더 프리워밍 — 첫 타격/첫 그로기 GLSL 컴파일 히칫을 로드 시점으로 이동(shockwaveVFX 패턴 확장).
  //   풀 슬롯을 화면 밖(y=-990)에서 1회 점화 → renderer.compile로 프로그램 캐시에 등재 → clear()로 소등(풀 유지).
  try{
    const _wp=new ctx.THREE.Vector3(0,-990,0);
    ctx.hitfx?.spawnBurst?.(_wp,1); ctx.hitfx?.spawnEmbers?.(_wp,1); ctx.hitfx?.spawnCore?.(_wp,1);
    ctx.hitfx?.groggyImpact?.(_wp,1);
    ctx.renderer.compile(ctx.scene, ctx.camera);
    ctx.hitfx?.clear?.();
  }catch(e){ console.warn('[game] hitfx 프리워밍 스킵', e&&e.message); }
  ctx.start();
  // ── 상단 나침반(uikit, 발할라형) — 카메라 월드방위 + 내 배 마커(gold) ──
  //   ★combat.js가 이미 마운트하면(sandbox/tutorial 공용) 스킵 — 중복 방지.
  if(!ctx.compass){ const _cv=new ctx.THREE.Vector3();
    ctx.compass = ukCompass({
      getHeading:()=>{ ctx.camera.getWorldDirection(_cv); return (Math.atan2(_cv.x,-_cv.z)*180/Math.PI+360)%360; },
      getMarkers:()=>{ const s=ctx.ship, pl=ctx.player&&ctx.player.pos; if(!s||!pl) return [];
        const sx=(s.x??s.pos?.x), sz=(s.z??s.pos?.z); if(sx==null||sz==null) return [];
        const dx=sx-pl.x, dz=sz-pl.z, d=Math.hypot(dx,dz);
        if(!isFinite(d)||d<8) return [];   // 배 위/근처면 숨김
        const bearing=(Math.atan2(dx,-dz)*180/Math.PI+360)%360;
        return [{ bearing, dist:d<1000?Math.round(d)+'m':(d/1000).toFixed(1)+'km', accent:'gold' }]; }
    });
  }
  window.__ctx=ctx; window.__ready=true;
  try { initNetcode(ctx); } catch(e){ console.warn('[net] 초기화 실패(게임엔 무해)', e&&e.message); }   // 🌐 멀티(Phase 3) — 실패해도 싱글 진행
  if(terrain.collide.length){ LS.hide(); }
  else { LS.fail('섬 데이터 없음<br>맵에디터(editor.html)에서 섬 만들고 Ctrl+S 저장 →<br>같은 주소로 이 페이지 새로고침'); }
}catch(e){ if(!e?.redirecting){ LS.fail('초기화 실패<br>'+(e&&e.message||e)); console.error(e); } }
</script>
</body></html>
